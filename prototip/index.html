<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piro Gastro — Professional Kitchen Solutions</title>
<meta name="description" content="Piro Gastro — professional kitchen solutions. Pizza equipment, refrigeration, preparation, cooking, bakery, dishwashing, ventilation, coffee and spare parts for restaurants, hotels and bakeries.">
<style>
/* ================================================================
   Piro Gastro — design system
   navy · metallic grey · gold · white space
   ================================================================ */
:root{
  --navy-950:#050D18;
  --navy-900:#0A1B2E;
  --navy-800:#0E2438;
  --navy-700:#173350;
  --navy-600:#22496E;
  --navy-500:#2F6396;

  --steel-900:#39424D;
  --steel-700:#5A6674;
  --steel-500:#8794A3;
  --steel-400:#A9B4C0;
  --steel-300:#C7D0DA;
  --steel-200:#DFE5EC;
  --steel-100:#EEF2F6;
  --steel-50:#F7F9FB;

  --gold-800:#8A6C28;
  --gold-700:#A8842F;
  --gold:#C8A24A;
  --gold-400:#DCBE79;
  --gold-200:#EFE0BC;

  --white:#fff;
  --ok:#1B8F62;
  --warn:#C48200;
  --danger:#BB3B2B;
  --info:#2563A8;

  --ink:#0B1826;
  --ink-2:#46525F;

  --r-s:4px; --r:10px; --r-l:18px;
  --sh-1:0 1px 2px rgba(10,27,46,.05);
  --sh-2:0 4px 14px rgba(10,27,46,.07);
  --sh-3:0 14px 40px rgba(10,27,46,.10);
  --sh-4:0 30px 80px rgba(10,27,46,.17);

  --maxw:1400px;
  --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:#fff;font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
svg{display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5,h6{margin:0;line-height:1.14;font-weight:700;letter-spacing:-.022em;color:var(--navy-900)}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
::selection{background:var(--gold);color:var(--navy-950)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 30px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- typography helpers ---------- */
.kicker{display:inline-block;font-size:10.6px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold-700);font-weight:750;margin-bottom:14px}
.kicker.on-dark{color:var(--gold-400)}
.sec-h{margin-bottom:46px;max-width:760px}
.sec-h.mid{margin:0 auto 50px;text-align:center}
.sec-h h2{font-size:clamp(26px,3.1vw,40px);margin-bottom:14px}
.sec-h p{color:var(--ink-2);font-size:16px}
.blk{padding:92px 0}
.blk.sm{padding:60px 0}
.soft{background:var(--steel-50)}
.dark{background:var(--navy-950);color:#fff}
.dark h1,.dark h2,.dark h3,.dark h4{color:#fff}
.dark p{color:#9CB0C6}
.rule{height:1px;background:var(--steel-200)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  padding:15px 30px;border:1px solid transparent;border-radius:var(--r-s);background:none;
  font-size:12.6px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  transition:.2s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.btn .ic{width:15px;height:15px;flex:none}
.btn-primary{background:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-700);transform:translateY(-1px);box-shadow:var(--sh-3)}
.btn-gold{background:var(--gold);color:var(--navy-950)}
.btn-gold:hover{background:var(--gold-400);transform:translateY(-1px);box-shadow:0 12px 30px rgba(200,162,74,.4)}
.btn-line{border-color:var(--steel-300);color:var(--navy-900);background:#fff}
.btn-line:hover{border-color:var(--navy-900)}
.btn-onphoto{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.btn-onphoto:hover{background:#fff;color:var(--navy-900);border-color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:9px 16px;font-size:11px;letter-spacing:.08em}
.btn-xs{padding:6px 11px;font-size:10.4px;letter-spacing:.06em}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.lnk{color:var(--navy-600);font-weight:600;font-size:12.4px;letter-spacing:.1em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.lnk:hover{color:var(--gold-700)}
.lnk .ar{width:16px;height:1px;background:currentColor;position:relative;transition:.22s}
.lnk .ar::after{content:"";position:absolute;right:0;top:-2.5px;width:6px;height:6px;
  border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.lnk:hover .ar{width:26px}

/* ================= PHOTO SLOTS =================
   every image on this site is an editable slot   */
.ph{position:relative;overflow:hidden;background:var(--navy-900);isolation:isolate}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.6,.2,1)}
.ph.contain img{object-fit:contain}
.ph.pad img{padding:9%}
.ph-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;padding:16px;
  background:linear-gradient(150deg,#0E2438 0%,#0A1B2E 46%,#050D18 100%)}
.ph-empty::before{content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(120% 90% at 30% 0%,rgba(200,162,74,.16),transparent 60%)}
.ph-empty b{position:relative;font-size:9.6px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-400);font-weight:700}
.ph-empty span{position:relative;font-size:11.4px;color:#8FA3BA;max-width:230px;line-height:1.5}
.ph-empty .code{position:relative;font-family:var(--mono);font-size:10.6px;color:#61748B;letter-spacing:.08em}
.ph.light .ph-empty{background:linear-gradient(150deg,#F2F5F9,#DDE4EC)}
.ph.light .ph-empty b{color:var(--gold-700)}
.ph.light .ph-empty span{color:var(--steel-700)}
.ph.light .ph-empty .code{color:var(--steel-500)}
.ph-edit{position:absolute;right:10px;top:10px;z-index:5;display:none}
body.editmode .ph-edit{display:block}
.ph-edit button{border:0;border-radius:var(--r-s);background:rgba(10,27,46,.86);color:#fff;
  padding:7px 12px;font-size:10.4px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  backdrop-filter:blur(6px)}
.ph-edit button:hover{background:var(--gold);color:var(--navy-950)}
.r-16-9{aspect-ratio:16/9}
.r-4-3{aspect-ratio:4/3}
.r-1-1{aspect-ratio:1/1}
.r-3-4{aspect-ratio:3/4}
.r-3-2{aspect-ratio:3/2}

/* ================= TOP BAR (reference layout) ================= */
.topbar{background:var(--navy-950);color:#8CA0B7}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:58px;padding-top:10px;padding-bottom:10px}
.tb-side{display:flex;gap:38px;align-items:center}
.tb-side.right{justify-content:flex-end}
.tb-i{display:flex;align-items:center;gap:12px;white-space:nowrap}
.tb-i .ic{width:21px;height:21px;color:var(--gold);flex:none}
.tb-i b{display:block;color:#fff;font-size:12.6px;font-weight:650;letter-spacing:.01em}
.tb-i span{font-size:11.4px;color:#7B90A8}
/* logo */
.logo{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;flex:none}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-mark{flex:none;width:auto;display:inline-flex;align-items:center}
.logo-mark.plate{background:#fff;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo-name{font-size:26px;font-weight:800;letter-spacing:.01em;color:#fff;line-height:1;
  white-space:nowrap}
.logo-name em{font-style:normal;color:var(--gold)}
.logo-sub{font-size:8.4px;letter-spacing:.42em;text-transform:uppercase;color:#7B90A8;font-weight:600;white-space:nowrap}
.logo.on-light .logo-name{color:var(--navy-900)}
.logo.on-light .logo-sub{color:var(--steel-700)}

/* ================= NAV ================= */
.navbar{background:#fff;border-bottom:1px solid var(--steel-200);position:sticky;top:0;z-index:90;transition:.25s}
.navbar.stuck{box-shadow:var(--sh-3)}
.navbar .wrap{display:flex;align-items:center;gap:22px;height:74px}
.homebtn{display:flex;align-items:center;gap:10px;padding:15px 20px;border-radius:var(--r-s);
  border:2px solid var(--steel-200);background:#fff;color:var(--navy-900);flex:none;
  font-size:12.4px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:.2s;cursor:pointer}
.homebtn:hover{border-color:var(--navy-900);background:var(--navy-900);color:#fff}
.homebtn .ic{width:17px;height:17px}
@media(max-width:820px){.homebtn span{display:none}.homebtn{padding:15px 15px}}
.catbtn{display:flex;align-items:center;gap:11px;background:var(--navy-900);color:#fff;border:0;cursor:pointer;
  padding:15px 24px;border-radius:var(--r-s);font-size:12.4px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  flex:none;transition:.2s}
.catbtn:hover{background:var(--gold);color:var(--navy-950)}
.catbtn .ic{width:16px;height:16px}
.nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.nav a{padding:10px 12px;border-radius:var(--r-s);font-size:13px;font-weight:600;color:var(--navy-800);
  white-space:nowrap;transition:.16s}
.nav a:hover{background:var(--steel-100);color:var(--navy-600)}
.nav a.on{color:var(--gold-700)}
.navtools{display:flex;align-items:center;gap:9px;flex:none}
.search{position:relative;display:flex;align-items:center}
.search input{width:230px;padding:12px 42px 12px 16px;border:1px solid var(--steel-200);border-radius:999px;
  background:var(--steel-50);font-size:13px;outline:none;transition:.24s}
.search input:focus{width:300px;background:#fff;border-color:var(--navy-600);box-shadow:0 0 0 4px rgba(47,99,150,.1)}
.search button{position:absolute;right:5px;border:0;background:none;cursor:pointer;padding:7px;color:var(--steel-700)}
.search .ic{width:17px;height:17px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--steel-200);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--navy-800);transition:.2s;flex:none}
.iconbtn:hover{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.iconbtn .ic{width:18px;height:18px}
.dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);
  color:var(--navy-950);font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.burger{display:none;width:46px;height:44px;border:1px solid var(--steel-200);border-radius:var(--r-s);background:#fff;
  cursor:pointer;place-items:center;flex:none}
.burger i{width:19px;height:2px;background:var(--navy-900);position:relative;display:block;border-radius:2px}
.burger i::before,.burger i::after{content:"";position:absolute;left:0;width:19px;height:2px;background:var(--navy-900);border-radius:2px}
.burger i::before{top:-6px}.burger i::after{top:6px}
/* mega menu */
.mega{position:absolute;left:30px;top:calc(100% + 8px);width:min(1000px,calc(100vw - 60px));background:#fff;
  border:1px solid var(--steel-200);border-radius:var(--r);box-shadow:var(--sh-4);padding:18px;z-index:95;
  display:none;grid-template-columns:repeat(3,1fr);gap:6px}
.mega.on{display:grid}
.mega a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:var(--r-s);transition:.16s}
.mega a:hover{background:var(--steel-50)}
.mega .mi{width:52px;height:40px;border-radius:var(--r-s);overflow:hidden;flex:none;background:var(--navy-900)}
.mega b{display:block;font-size:13.4px;color:var(--navy-900)}
.mega small{font-size:11.2px;color:var(--steel-700)}
.navbar .wrap{position:relative}

/* ---------- lang ---------- */
.lang{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#8CA0B7;padding:5px 12px;border-radius:999px;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:.1em;transition:.18s}
.lang button:hover{color:#fff}
.lang button.on{background:var(--gold);color:var(--navy-950)}
.lang.light{background:var(--steel-100)}
.lang.light button{color:var(--steel-700)}
.lang.light button.on{background:var(--navy-900);color:#fff}

/* ================= HERO (reference layout: light, copy left / photo right) ============ */
.hero{position:relative;background:linear-gradient(120deg,#FFFFFF 0%,#F4F8FC 42%,#E9F1F8 100%);overflow:hidden}
.hero::after{content:"";position:absolute;right:-8%;top:-30%;width:60%;height:150%;border-radius:50%;
  background:radial-gradient(circle,rgba(47,99,150,.07),transparent 62%);pointer-events:none}
.hero-in{position:relative;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);
  gap:54px;align-items:center;padding:70px 0 116px}
.hero-copy{max-width:600px}
.hero .kicker{display:flex;align-items:center;gap:14px;color:var(--navy-700);margin-bottom:20px}
.hero .kicker::before{content:"";width:44px;height:3px;background:var(--navy-700);flex:none}
.hero h1{font-size:clamp(34px,4.4vw,56px);line-height:1.06;margin-bottom:20px;letter-spacing:-.035em;color:var(--navy-900)}
.hero h1 .g{color:var(--navy-900)}
.hero-logo{display:flex;align-items:center;gap:22px;margin-bottom:26px}
.hero-logo .hl-mark{flex:none;height:112px}
.hero-logo .hl-mark .ph{background:transparent;height:100%;width:auto;display:inline-block}
.hero-logo .hl-mark .ph img{height:100%;width:auto;object-fit:contain}
.hero-logo .hl-mark .ph-empty{position:static;width:104px;height:112px;border-radius:10px;
  background:linear-gradient(150deg,#EAF1F8,#D5E2EE)}
.hero-logo .hl-txt{font-size:42px;font-weight:800;letter-spacing:-.015em;color:var(--navy-900);line-height:1}
@media(max-width:700px){.hero-logo{gap:14px;margin-bottom:18px}
  .hero-logo .hl-mark{height:74px}.hero-logo .hl-txt{font-size:29px}}
.hero .lead{font-size:clamp(15px,1.25vw,17.5px);color:var(--ink-2);max-width:520px;margin-bottom:30px}
.hero-feats{display:flex;gap:38px;flex-wrap:wrap;margin-bottom:34px}
.hf{display:flex;align-items:center;gap:12px}
.hf .ic{width:28px;height:28px;color:var(--navy-800);flex:none;stroke-width:1.5}
.hf b{display:block;font-size:13.4px;color:var(--navy-900);font-weight:700}
.hf span{font-size:11.8px;color:var(--steel-700)}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-photo{position:relative;min-height:430px}
.hero-photo .ph{background:transparent;border-radius:var(--r)}
.hero-photo .ph img{object-fit:contain;object-position:center}
.hero-photo .ph-empty{background:linear-gradient(150deg,#EAF1F8,#D5E2EE);border-radius:var(--r)}
.hero-photo .ph-empty b{color:var(--navy-700)}
.hero-photo .ph-empty span{color:var(--steel-700)}
.hero-photo .ph-empty .code{color:var(--steel-500)}

/* ================= CATEGORY STRIP (overlapping) ================= */
.catstrip{position:relative;z-index:5;margin-top:-72px}
.catstrip-in{background:#fff;border-radius:var(--r);box-shadow:var(--sh-4);padding:26px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.catcard{display:block;border:1px solid var(--steel-200);border-radius:var(--r-s);overflow:hidden;transition:.26s;background:#fff}
.catcard:hover{border-color:var(--gold);box-shadow:var(--sh-3);transform:translateY(-4px)}
.catcard .ph{aspect-ratio:16/10}
.catcard:hover .ph img{transform:scale(1.06)}
.catcard .cc-b{padding:15px 16px 17px}
.catcard h3{font-size:14.6px;margin-bottom:4px}
.catcard p{font-size:11.6px;color:var(--steel-700);margin-bottom:11px;min-height:32px}

/* ================= SERVICE STRIP ================= */
.svc{background:var(--navy-900);color:#fff}
.svc .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.svc-i{display:flex;align-items:center;gap:16px;padding:32px 26px;border-right:1px solid rgba(255,255,255,.1)}
.svc-i:last-child{border-right:0}
.svc-i .ic{width:26px;height:26px;color:var(--gold);flex:none}
.svc-i b{display:block;font-size:14px;font-weight:650}
.svc-i span{font-size:12.4px;color:#8FA3BA}

/* ================= PRODUCT CARDS ================= */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.pcard{border:1px solid var(--steel-200);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;
  flex-direction:column;transition:.24s;position:relative}
.pcard:hover{box-shadow:var(--sh-3);transform:translateY(-5px);border-color:var(--steel-300)}
.pcard .ph{aspect-ratio:1/1;background:var(--steel-50);cursor:pointer}
.pcard:hover .ph img{transform:scale(1.05)}
.flags{position:absolute;left:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:6px}
.flag{padding:4px 10px;border-radius:3px;font-size:9.4px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.f-new{background:var(--navy-900);color:#fff}
.f-camp{background:var(--danger);color:#fff}
.f-top{background:var(--gold);color:var(--navy-950)}
.pc-b{padding:17px 19px 20px;display:flex;flex-direction:column;flex:1}
.pc-brand{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-700);font-weight:750;margin-bottom:7px}
.pc-b h3{font-size:14.6px;line-height:1.34;margin-bottom:9px;min-height:38px;cursor:pointer}
.pc-b h3:hover{color:var(--navy-600)}
.pspecs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pspecs span{font-size:10.4px;background:var(--steel-100);color:var(--steel-900);padding:3px 8px;border-radius:3px;font-weight:600}
.stk{display:flex;align-items:center;gap:7px;font-size:11.6px;font-weight:650;margin-bottom:12px}
.stk i{width:7px;height:7px;border-radius:50%;flex:none}
.s-in{color:var(--ok)}.s-in i{background:var(--ok)}
.s-low{color:var(--warn)}.s-low i{background:var(--warn)}
.s-out{color:var(--danger)}.s-out i{background:var(--danger)}
.prow{margin-top:auto;display:flex;align-items:flex-end;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.price{font-size:21px;font-weight:800;color:var(--navy-900);letter-spacing:-.02em;line-height:1.1}
.price small{display:block;font-size:10.6px;font-weight:600;color:var(--steel-700);letter-spacing:0}
.price-was{font-size:13px;color:var(--steel-500);text-decoration:line-through}
.pacts{display:grid;grid-template-columns:1fr auto;gap:8px}
.pacts .btn{padding:12px 12px;font-size:11px}
.sqbtn{width:44px;padding:0!important;border:1px solid var(--steel-300);background:#fff;color:var(--navy-800)}
.sqbtn:hover{background:var(--gold);border-color:var(--gold);color:var(--navy-950)}

/* ================= BANNERS ================= */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.banner{position:relative;border-radius:var(--r);overflow:hidden;min-height:230px;display:flex;align-items:flex-end;cursor:pointer}
.banner .ph{position:absolute;inset:0}
.banner:hover .ph img{transform:scale(1.06)}
.banner .bv{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,13,24,.9),rgba(5,13,24,.25) 62%,transparent)}
.banner .bc{position:relative;z-index:3;padding:26px;color:#fff}
.banner .bc b{display:block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-400);margin-bottom:9px}
.banner .bc h3{font-size:20px;color:#fff;margin-bottom:7px}
.banner .bc p{font-size:12.8px;color:#BFCEDD;max-width:300px}
.banner-wide{grid-column:span 3;min-height:300px}

/* ================= CATALOG ================= */
.backbtn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--steel-300);
  background:#fff;border-radius:var(--r-s);cursor:pointer;font-size:12.6px;font-weight:650;color:var(--navy-900);
  margin-right:6px;transition:.15s}
.backbtn:hover{border-color:var(--navy-900);background:var(--navy-900);color:#fff}
.backbtn .ic{width:14px;height:14px;transform:rotate(180deg)}

.cat-layout{display:grid;grid-template-columns:270px 1fr;gap:38px;align-items:start}

.cat-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;

/* ================= PDP ================= */

.choice b{display:block;font-size:14px}
.choice small{font-size:11.6px;color:var(--steel-700)}

.two{display:grid;grid-template-columns:1fr 380px;gap:34px;align-items:start}

.cartrow{display:grid;grid-template-columns:92px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--steel-200);align-items:center}

/* payment / carrier marks */

/* ================= FOOTER ================= */
footer.site{background:var(--navy-950);color:#8CA0B7;padding:74px 0 0}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.2fr;gap:42px;padding-bottom:52px}
footer.site h5{color:#fff;font-size:11.6px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px}

/* ================= OVERLAYS ================= */
.ovl{position:fixed;inset:0;background:rgba(5,13,24,.66);backdrop-filter:blur(4px);z-index:400;display:none;
  align-items:center;justify-content:center;padding:24px}
.ovl.on{display:flex}
.modal{background:#fff;border-radius:var(--r-l);width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:var(--sh-4);
  animation:pop .26s cubic-bezier(.34,1.4,.5,1)}

.modal.xw{max-width:1140px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
.mh{padding:22px 26px;border-bottom:1px solid var(--steel-200);display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;background:#fff;z-index:3;border-radius:var(--r-l) var(--r-l) 0 0}

.mb{padding:24px 26px}
.mf{padding:17px 26px;border-top:1px solid var(--steel-200);display:flex;gap:10px;justify-content:flex-end;
  background:var(--steel-50);border-radius:0 0 var(--r-l) var(--r-l);position:sticky;bottom:0}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--steel-100);cursor:pointer;display:grid;place-items:center;flex:none}

.df{padding:20px 24px;border-top:1px solid var(--steel-200);background:var(--steel-50)}

.scrim.on{opacity:1;visibility:visible}
.toasts{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--navy-900);color:#fff;padding:14px 20px;border-radius:var(--r-s);box-shadow:var(--sh-4);
  font-size:13.4px;display:flex;align-items:center;gap:11px;max-width:380px;animation:sl .3s}

.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh;background:var(--steel-50)}

.aside nav a .ic{width:17px;height:17px;flex:none;opacity:.85}

.abody{padding:26px 30px 70px}

.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy-700)}
.kpi.g::after{background:var(--gold)}.kpi.o::after{background:var(--ok)}
.kpi.w::after{background:var(--warn)}.kpi.d::after{background:var(--danger)}

.kpi .kl .ic{width:15px;height:15px;color:var(--steel-500)}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.025em;color:var(--navy-900);line-height:1.1}
.kpi .kd{font-size:11.8px;margin-top:6px;color:var(--steel-700)}
.up{color:var(--ok);font-weight:700}.down{color:var(--danger);font-weight:700}
.card{background:#fff;border:1px solid var(--steel-200);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.chead{padding:17px 21px;border-bottom:1px solid var(--steel-200);display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.chead h3{font-size:15px;margin-right:auto}
.cbody{padding:21px}
.gr2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.gr11{display:grid;grid-template-columns:1fr 1fr;gap:18px}
table.d{font-size:13px}

.scrollx{overflow-x:auto}

.c-b{background:#E6EFF9;color:#194E86}.c-g{background:#E1F5EC;color:#0E6647}

.n-d{background:#FDECE9;border:1px solid #F1B7AC;color:#8C2A19}
.n-o{background:#E6F7F0;border:1px solid #A9E0C9;color:#0E5C3F}
.seg{display:inline-flex;background:var(--steel-100);border-radius:7px;padding:3px}

.rowitem .rt b{display:block;font-size:13.6px}

.tgl{position:relative;width:42px;height:23px;border-radius:999px;background:var(--steel-300);cursor:pointer;

.tgl::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}

.medgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.medcard{border:1px solid var(--steel-200);border-radius:var(--r-s);overflow:hidden;background:#fff;position:relative}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--navy-950)}

.tl-i{position:relative}

.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.vcard{padding:30px;border:1px solid var(--steel-200);border-radius:var(--r);background:#fff}
.vcard .vi{width:48px;height:48px;border-radius:10px;background:var(--navy-900);display:grid;place-items:center;margin-bottom:18px}
.vcard .vi .ic{width:23px;height:23px;color:var(--gold)}
.vcard h3{font-size:16.5px;margin-bottom:10px}
.vcard p{font-size:13.4px;color:var(--ink-2)}
.contactgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.brandgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.brandcard{border:1px solid var(--steel-200);border-radius:var(--r);background:#fff;transition:.22s;cursor:pointer;overflow:hidden}
.brandcard:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:var(--sh-3)}

.brandcard .bb{padding:18px 20px;text-align:center}
.brandcard b{font-size:16px;letter-spacing:.06em;color:var(--navy-900);text-transform:uppercase}
.brandcard small{display:block;font-size:11.4px;color:var(--steel-700);margin-top:5px}

  .inv{border:0;padding:0;max-width:100%}
}

  .ow-stat .v{font-size:34px}
}
</style>

/* ================= LOGO ================= */
function logoMark(size,onDark){
  /* ONAYLI LOGO — tek kaynak. Panelden degistirilirse her yerde degisir. */
  const h=size||34;
  const src=(typeof DB!=="undefined"&&DB.d&&DB.d.content&&DB.d.content.hero&&DB.d.content.hero.logo)
    ||"assets/logo-mark.png";
  const img=`<img src="${esc(src)}" alt="Piro Gastro" class="logo-img"
    style="height:${h}px;width:auto;display:block" onerror="this.style.visibility=&quot;hidden&quot;">`;
  const pad=Math.max(4,Math.round(h*0.14));
  return onDark
    ? `<span class="logo-mark plate" style="padding:${pad}px">${img}</span>`
    : `<span class="logo-mark">${img}</span>`;
}
function logoBlock(opts){
  opts=opts||{};
  const light=opts.light, size=opts.size||34;
  return `<a href="#/" class="logo ${light?"on-light":""}" aria-label="Piro Gastro">
    <span class="logo-row" style="color:${light?"#0A1B2E":"#fff"}">${opts.mark===false?"":logoMark(size,!light)}
      <span class="logo-name">Piro <em>Gastro</em></span></span>
    <span class="logo-sub" lang="en">Professional Kitchen Solutions</span></a>`;
}

function buildSeed(){
  const r=rng(20260817), pick=a=>a[Math.floor(r()*a.length)];
  const content=seedContent();
  const categories=SEED_CATS.map((c,i)=>({id:c[0],icon:c[1],name:c[2],desc:c[3],
    image:"assets/cat-"+c[0]+".jpg",order:i,visible:true}));
  const brands=SEED_BRANDS.map(b=>({id:b[0],name:b[1],country:b[2],desc:b[3],image:"assets/brand-"+b[0]+".jpg"}));
  const products=seedProducts();

  const customers=[];
  for(let i=0;i<58;i++){
    const f=pick(FIRST),l=pick(LAST),co=pick(COMPS)+" "+pick(["AB","AB","HB","Ltd","A/S","AŞ"]);
    const [city,cc]=pick(CITIES);
    customers.push({id:"C-"+pad(1000+i,4),name:f+" "+l,company:co,
      email:(f+"."+l).toLowerCase().replace(/[^a-z.]/g,"")+"@"+slug(co).slice(0,12)+".com",
      phone:(cc==="TR"?"+90 5":"+46 7")+Math.floor(10000000+r()*89999999),
      vatno:(cc==="SE"?"SE":cc)+Math.floor(100000000000+r()*899999999999),
      addr:pick(["Storgatan","Industrivägen","Hamngatan","Atatürk Cd.","Kungsgatan","Bahçelievler Sk."])+" "+(1+Math.floor(r()*90)),
      zip:String(10000+Math.floor(r()*80000)),city,country:cc,
      joined:(2023+Math.floor(r()*3))+"-"+pad(1+Math.floor(r()*12))+"-"+pad(1+Math.floor(r()*28))});
  }
  const orders=[],invoices=[];
  const today=new Date(2026,7,17); let n=0,inv=0;
  for(let back=400;back>=0;back--){
    const day=new Date(today); day.setDate(day.getDate()-back);
    const dow=day.getDay();
    const season=1+0.32*Math.sin((day.getMonth()/12)*Math.PI*2)+(back<120?0.26:0)+(back<40?0.14:0);
    let count=Math.round((dow===0?0.5:dow===6?1:2.2)*season*(0.5+r()));
    if(back===0) count=Math.max(2,count);
    for(let k=0;k<count;k++){
      const c=pick(customers), lines=[];
      const nl=1+Math.floor(r()*r()*3.2);
      for(let li=0;li<=nl;li++){
        const p=products[Math.floor(Math.pow(r(),1.5)*products.length)];
        if(lines.some(x=>x.pid===p.id)) continue;
        const q=p.price<300?(1+Math.floor(r()*8)):(1+Math.floor(r()*r()*3));
        lines.push({pid:p.id,sku:p.sku,name:p.name,qty:q,price:p.price});
      }
      if(!lines.length) continue;
      const net=sum(lines,l=>l.price*l.qty);
      const car=pick(CARRIERS), ship=net>2500?0:car.price;
      const vr=c.country==="TR"?.20:c.country==="SE"?.25:.21;
      const vat=(net+ship)*vr;
      let st;
      if(back>16) st=r()<.045?"cancelled":"delivered";
      else if(back>8) st=r()<.05?"cancelled":r()<.75?"delivered":"shipped";
      else if(back>4) st=r()<.5?"shipped":"processing";
      else if(back>1) st=r()<.5?"processing":"paid";
      else st=r()<.45?"new":"paid";
      const id="PGC-"+day.getFullYear()+pad(day.getMonth()+1)+"-"+pad(++n,4);
      const o={id,date:day.toISOString(),customerId:c.id,customer:{...c},lines,
        net:+net.toFixed(2),shipping:ship,vatRate:vr,vat:+vat.toFixed(2),
        total:+(net+ship+vat).toFixed(2),currency:"EUR",
        payment:pick(PAYMENTS).id,carrier:car.id,status:st,notes:""};
      orders.push(o);
      if(st!=="cancelled"){
        const due=new Date(day); due.setDate(due.getDate()+30);
        invoices.push({id:"F-"+day.getFullYear()+"-"+pad(++inv,5),orderId:id,customerId:c.id,
          issued:day.toISOString(),due:due.toISOString(),net:o.net+o.shipping,vatRate:vr,
          vat:o.vat,total:o.total,currency:"EUR",
          paid:st==="delivered"||st==="shipped"||(st==="paid"&&r()<.8)});
      }
    }
  }
  const sold={};
  orders.forEach(o=>{if(o.status!=="cancelled")o.lines.forEach(l=>sold[l.pid]=(sold[l.pid]||0)+l.qty);});
  products.forEach(p=>p.sold=sold[p.id]||0);

  const quotes=[];
  for(let i=0;i<6;i++){
    const c=pick(customers),p=pick(products),d=new Date(today);
    d.setDate(d.getDate()-Math.floor(r()*18));
    quotes.push({id:"Q-"+pad(2400+i,4),date:d.toISOString(),name:c.name,company:c.company,email:c.email,
      phone:c.phone,productId:p.id,qty:1+Math.floor(r()*5),status:i<4?"open":"answered",
      msg:pick(["Komplett köksrenovering, behöver installation och utbildning.",
        "Please quote with extended warranty and delivery to Istanbul.",
        "Vi öppnar en andra restaurang i november.",
        "Yeni şube için komple ekipman listesi ve fiyat istiyoruz.",
        "Need lead time and volume pricing for 4 units."])});
  }
  const users=[
   {id:"U-001",name:"Astrid Holm",email:"admin@pirogastro.se",pass:"admin123",role:"admin",active:true,last:"2026-08-17T07:12:00Z"},
   {id:"U-002",name:"Petra Lindgren",email:"ekonomi@pirogastro.se",pass:"vat2026",role:"accountant",active:true,last:"2026-08-16T15:40:00Z"},
   {id:"U-003",name:"Viktor Sund",email:"super@pirogastro.se",pass:"super123",role:"super",active:true,last:"2026-08-17T06:02:00Z"},
   {id:"U-004",name:"Deniz Aydın",email:"tr@pirogastro.se",pass:"admin123",role:"admin",active:true,last:"2026-08-15T11:20:00Z"},
   {id:"U-005",name:"Johan Ek",email:"johan@trattorianord.se",pass:"demo1234",role:"customer",active:true,last:"2026-08-14T09:00:00Z"}
  ];
  return {v:1,settings:{...SETTINGS},content,categories,brands,products,customers,orders,invoices,quotes,users,
    media:[],audit:[{ts:new Date(2026,7,17,7,12).toISOString(),user:"Astrid Holm",act:"login",detail:"Admin session"}],
    seq:{order:n,invoice:inv}};
}

const stockLabel=p=>({out:t("outStock"),low:t("lowStock"),in:t("inStock")})[stockState(p)];
function campaignOn(p){
  if(!p.campaign||!p.campaign.on||!p.campaign.percent) return false;
  if(p.campaign.until && new Date(p.campaign.until)<new Date()) return false;
  return true;
}
const netPrice=p=>{let v=campaignOn(p)?Math.round(p.price*(1-p.campaign.percent/100)):p.price;if(p.salePrice&&p.salePrice>0&&p.salePrice<v)v=p.salePrice;return v;};
const hasDiscount=p=>netPrice(p)<p.price;

/* ================================================================
   IMAGE SLOTS — no picture is hardcoded; each one is addressable
   by a path like "content.hero.image" or "product:<id>:2"
   ================================================================ */
/* Görsel yönetimi yetkisi: yalnızca Süper Admin, süper yönetici ve
   yetkili yönetici. Müşteri tarafında hiçbir yönetim kontrolü çıkmaz. */
function canEditMedia(){
  /* 1. kosul: SADECE yonetim paneli rotalarinda. Magaza tarafinda
     (ana sayfa, urunler, kategoriler, markalar, urun detayi, sepet...)
     kim giris yapmis olursa olsun hicbir yonetim kontrolu cikmaz. */
  const n=(S.route&&S.route.name)||"";
  if(n!=="admin"&&n!=="super"&&n!=="owner") return false;
  /* 2. kosul: yetkili rol */
  if(!S.user) return false;
  const r=S.user.role;
  if(r==="owner"||r==="super") return true;
  if(r!=="admin") return false;
  const pr=(typeof owUserPerms==="function")?owUserPerms():null;
  return pr?(pr.indexOf("content")>=0||pr.indexOf("media")>=0||pr.indexOf("products")>=0):true;
}
function slot(ref,opts){
  opts=opts||{};
  const cls=opts.cls||"", ratio=opts.ratio?" "+opts.ratio:"";
  const label=opts.label||t("imageSlot");
  const path=opts.path||"";
  const alt=esc(opts.alt||label);
  const code=opts.code||(ref&&ref.indexOf("data:")!==0?ref:"");
  const empty=`<div class="ph-empty"><b>${esc(label)}</b><span>${esc(t("noImage"))}</span>`+
    (code?`<span class="code">${esc(code)}</span>`:"")+`</div>`;
  const edit=(path&&canEditMedia())?`<div class="ph-edit"><button data-slot="${esc(path)}" data-slotlabel="${esc(label)}">`+
    `${t("replaceImage")}</button></div>`:"";
  const attrs=`class="ph ${cls}${ratio}"`+(path?` data-slotzone="${esc(path)}"`:"")+
    ` data-fallback="${esc(empty)}"`;
  if(!ref) return `<div ${attrs}>${empty}${edit}</div>`;
  return `<div ${attrs}><img src="${esc(ref)}" alt="${alt}" loading="lazy" onerror="imgFail(this)">${edit}</div>`;
}
function imgFail(el){
  const p=el.parentNode; if(!p) return; el.remove();
  if(!p.querySelector(".ph-empty")) p.insertAdjacentHTML("afterbegin",p.dataset.fallback||"");
}
/* read / write any nested slot path */
function getPath(path){
  const parts=path.split("."); let o=DB.d;
  for(const p of parts){ if(o==null)return undefined; o=Array.isArray(o)&&/^\d+$/.test(p)?o[+p]:o[p]; }
  return o;
}
function setPath(path,val){
  const parts=path.split("."); let o=DB.d;
  for(let i=0;i<parts.length-1;i++){ const p=parts[i]; o=Array.isArray(o)&&/^\d+$/.test(p)?o[+p]:o[p]; if(o==null)return false; }
  const last=parts[parts.length-1];
  if(Array.isArray(o)&&/^\d+$/.test(last)) o[+last]=val; else o[last]=val;
  return true;
}
/* file -> resized data URL (keeps localStorage viable) */
function fileToDataUrl(file,maxW,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const scale=Math.min(1,(maxW||1600)/im.width);
        const cv=document.createElement("canvas");
        cv.width=Math.round(im.width*scale); cv.height=Math.round(im.height*scale);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",quality||0.82));
      };
      im.onerror=()=>res(fr.result);
      im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
let _pendingSlot=null;
function pickImageFor(path,label){
  if(typeof canEditMedia==="function" && !canEditMedia()) return;
  _pendingSlot={path,label};
  const inp=$("#filepick"); inp.value=""; inp.click();
}
$("#filepick").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f||!_pendingSlot) return;
  try{
    const url=await fileToDataUrl(f,1800,.82);
    DB.d.media.unshift({id:uid("M"),name:f.name,src:url,added:new Date().toISOString()});
    DB.d.media=DB.d.media.slice(0,120);
    if(_pendingSlot.path!=="media.__new") setPath(_pendingSlot.path,url);
    DB.log(S.user&&S.user.name,"media.upload",_pendingSlot.path+" ← "+f.name);
    DB.save(); toast(t("saved")); render();
  }catch(err){ toast("Upload failed","err"); }
  _pendingSlot=null;
});

const cartLines=()=>S.cart.map(l=>({...l,p:prod(l.id)})).filter(l=>l.p);

function addToCart(id,qty){
  const p=prod(id); if(!p) return;
  const ex=S.cart.find(l=>l.id===id);
  if(ex) ex.qty=clamp(ex.qty+(qty||1),1,999); else S.cart.push({id,qty:qty||1});
  saveCart(); toast(L(p.name)+" — "+t("added")); syncCartBadge();
}
function setQty(id,q){const l=S.cart.find(x=>x.id===id); if(!l)return; l.qty=clamp(q,1,999); saveCart(); render();}
function removeLine(id){S.cart=S.cart.filter(l=>l.id!==id); saveCart(); render();}
function syncCartBadge(){
  const b=$('[data-cartbtn]'); if(!b)return;

  if(c){ if(d)d.textContent=c; else b.insertAdjacentHTML("beforeend",`<span class="dot">${c}</span>`); }
  else if(d) d.remove();
}

function pageProducts(q){

  let list=prods().filter(p=>!p.hidden);
  if(f.q){const s=f.q.toLowerCase();
    list=list.filter(p=>L(p.name).toLowerCase().includes(s)||p.sku.toLowerCase().includes(s)||
      L(p.desc).toLowerCase().includes(s)||((brand(p.brand)||{}).name||"").toLowerCase().includes(s));}
  if(f.cats.length) list=list.filter(p=>f.cats.some(id=>inCat(p,id)));
  if(f.brands.length) list=list.filter(p=>f.brands.includes(p.brand));
  if(f.stock) list=list.filter(p=>p.stock>0);
  const sorters={featured:(a,b)=>(b.featured-a.featured)||(b.rating-a.rating),
    priceAsc:(a,b)=>netPrice(a)-netPrice(b),priceDesc:(a,b)=>netPrice(b)-netPrice(a),
    name:(a,b)=>L(a.name).localeCompare(L(b.name),cfg()._locale),
    new:(a,b)=>new Date(b.created)-new Date(a.created)};
  list.sort(sorters[f.sort]||sorters.featured);
  const title=f.cats.length===1&&cat(f.cats[0])?L(cat(f.cats[0]).name):t("productsNav");
  const curCat=f.cats.length===1?cat(f.cats[0]):null;

          if(S._fsig!==sig){S._fsig=sig;S.page=1;} return "";})()}
        ${(()=>{
          const PER=48, tot=list.length, pages=Math.max(1,Math.ceil(tot/PER));
          const cur=clamp(S.page,1,pages), from=(cur-1)*PER, slice=list.slice(from,from+PER);
          if(!tot) return `<div class="empty">${I("search")}<h3>${t("noResults")}</h3></div>`;
          let nums=[];
          for(let i=1;i<=pages;i++){
            if(i===1||i===pages||Math.abs(i-cur)<=2) nums.push(i);
            else if(nums[nums.length-1]!=="…") nums.push("…");
          }
          const pager=pages>1?`<div class="pager">
            <button class="pbtn" data-page="${cur-1}" ${cur===1?"disabled":""}>‹</button>
            ${nums.map(n=>n==="…"?`<span class="pdots">…</span>`
              :`<button class="pbtn ${n===cur?"on":""}" data-page="${n}">${n}</button>`).join("")}
            <button class="pbtn" data-page="${cur+1}" ${cur===pages?"disabled":""}>›</button>
            <span class="pinfo">${from+1}–${Math.min(from+PER,tot)} / ${tot}</span></div>`:"";
          return `<div class="pgrid">${slice.map(pcard).join("")}</div>`+pager;
        })()}
      </div></div></div><div style="height:70px"></div>`;

function embedUrl(u){
  const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
  if(yt) return "https://www.youtube.com/embed/"+yt[1];
  const vm=u.match(/vimeo\.com\/(\d+)/);
  if(vm) return "https://player.vimeo.com/video/"+vm[1];
  return u;
}

function placeOrder(f){
  const d=DB.d, lines=cartLines();
  const net=cartNet(), ship=shipCost(net,CO.carrier);
  const country=f.country||"SE";
  const vr=country==="TR"?.20:country==="SE"?.25:.21;
  const vat=(net+ship)*vr;
  let c=d.customers.find(x=>x.email.toLowerCase()===String(f.email).toLowerCase());
  if(!c){ c={id:"C-"+pad(1000+d.customers.length,4),name:f.name,company:f.company,email:f.email,phone:f.phone,
      vatno:f.vatno||"",addr:f.addr,zip:f.zip,city:f.city,country,joined:dstr(new Date())};
    d.customers.push(c); }
  else Object.assign(c,{name:f.name,company:f.company,phone:f.phone,addr:f.addr,zip:f.zip,city:f.city,country});
  const now=new Date();
  const id="PGC-"+now.getFullYear()+pad(now.getMonth()+1)+"-"+pad(++d.seq.order,4);
  const o={id,date:now.toISOString(),customerId:c.id,customer:{...c},
    lines:lines.map(l=>({pid:l.p.id,sku:l.p.sku,name:l.p.name,qty:l.qty,price:netPrice(l.p)})),
    net:+net.toFixed(2),shipping:ship,vatRate:vr,vat:+vat.toFixed(2),total:+(net+ship+vat).toFixed(2),
    currency:"EUR",payment:CO.payment,carrier:CO.carrier,status:"new",notes:f.notes||""};
  d.orders.push(o);
  const due=new Date(now); due.setDate(due.getDate()+30);
  const inv={id:"F-"+now.getFullYear()+"-"+pad(++d.seq.invoice,5),orderId:id,customerId:c.id,
    issued:now.toISOString(),due:due.toISOString(),net:o.net+o.shipping,vatRate:vr,vat:o.vat,
    total:o.total,currency:"EUR",paid:false,payment:CO.payment,carrier:CO.carrier};
  d.invoices.push(inv);
  o.lines.forEach(l=>{const p=prod(l.pid); if(p){p.stock=Math.max(0,p.stock-l.qty); p.sold=(p.sold||0)+l.qty;}});
  DB.log(c.name,"order",id+" · "+money2(o.total)+" · invoice "+inv.id);
  DB.save(); S.cart=[]; saveCart(); go("#/order/"+id);
}

function reorder(orderId){

<script>
/* ================================================================
   ANALYTICS
   ================================================================ */
const NOW=()=>new Date();
const okOrders=()=>DB.d.orders.filter(o=>o.status!=="cancelled");
const rev=o=>o.net+o.shipping;
const between=(l,f,t2)=>l.filter(o=>{const d=new Date(o.date);return d>=f&&d<=t2;});
const sDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const sWeek=d=>{const x=sDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const sMonth=d=>{const x=sDay(d);x.setDate(1);return x;};
const sYear=d=>{const x=sDay(d);x.setMonth(0,1);return x;};
function periodRange(p){const n=NOW();
  return p==="today"?[sDay(n),n]:p==="week"?[sWeek(n),n]:p==="month"?[sMonth(n),n]:[sYear(n),n];}
function stats(p){
  const [f,t2]=periodRange(p), len=t2-f;
  const cur=between(okOrders(),f,t2), prev=between(okOrders(),new Date(f-len-1),new Date(f-1));
  const r=sum(cur,rev), rp=sum(prev,rev);
  return {revenue:r,growth:rp>0?((r-rp)/rp*100):0,count:cur.length,prevCount:prev.length,
    units:sum(cur,o=>sum(o.lines,l=>l.qty)),avg:cur.length?r/cur.length:0,orders:cur};
}
function topProducts(list,n){
  const m={}; list.forEach(o=>o.lines.forEach(l=>{m[l.pid]=m[l.pid]||{qty:0,rev:0};
    m[l.pid].qty+=l.qty;m[l.pid].rev+=l.price*l.qty;}));
  return Object.entries(m).map(([id,v])=>({p:prod(id),...v})).filter(x=>x.p)
    .sort((a,b)=>b.rev-a.rev).slice(0,n||8);
}
const lowStock=()=>prods().filter(p=>p.stock<=p.threshold).sort((a,b)=>a.stock-b.stock);
function monthly(n){
  const out=[],d=NOW();
  for(let i=n-1;i>=0;i--){
    const f=new Date(d.getFullYear(),d.getMonth()-i,1), t2=new Date(d.getFullYear(),d.getMonth()-i+1,0,23,59,59);
    const l=between(okOrders(),f,t2);
    out.push({label:f.toLocaleDateString(cfg()._locale,{month:"short"}),full:f,value:sum(l,rev),count:l.length});
  } return out;
}
function daily(n){
  const out=[],d=NOW();
  for(let i=n-1;i>=0;i--){
    const f=sDay(new Date(d.getFullYear(),d.getMonth(),d.getDate()-i)), t2=new Date(f); t2.setHours(23,59,59);
    const l=between(okOrders(),f,t2);
    out.push({label:f.getDate()+"/"+(f.getMonth()+1),value:sum(l,rev),count:l.length});
  } return out;
}
function catRev(list){
  const m={}; list.forEach(o=>o.lines.forEach(l=>{const p=prod(l.pid); if(p)m[p.cat]=(m[p.cat]||0)+l.price*l.qty;}));
  return cats().map(c=>({label:L(c.name),value:m[c.id]||0})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
}
function payRev(list){
  const m={}; list.forEach(o=>m[o.payment]=(m[o.payment]||0)+rev(o));
  return PAYMENTS.map(p=>({label:p.label,value:m[p.id]||0})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
}
const COLORS=["#173350","#C8A24A","#2F6396","#1B8F62","#8794A3","#7E6BD8","#C48200","#BB3B2B","#3E8FA8"];
function lineChart(series,h){
  h=h||240; const w=760,pad=34;
  const max=Math.max(1,...series.map(s=>s.value));
  const step=(w-pad*2)/Math.max(1,series.length-1);
  const pts=series.map((s,i)=>[pad+i*step,h-pad-(s.value/max)*(h-pad*2)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="none">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6396" stop-opacity=".26"/><stop offset="1" stop-color="#2F6396" stop-opacity="0"/></linearGradient></defs>
    ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(h-pad-f*(h-pad*2)).toFixed(1)}"
      y2="${(h-pad-f*(h-pad*2)).toFixed(1)}" stroke="#E4EAF1"/>`).join("")}
    <path d="${line} L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pad} ${h-pad} Z" fill="url(#lg1)"/>
    <path d="${line}" fill="none" stroke="#173350" stroke-width="2.4" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#fff" stroke="#173350" stroke-width="2">
      <title>${esc(series[i].label)}: ${money(series[i].value)}</title></circle>`).join("")}
    ${series.map((s,i)=>(series.length>14&&i%2)?"":`<text x="${(pad+i*step).toFixed(1)}" y="${h-10}" font-size="10"
      fill="#8794A3" text-anchor="middle">${esc(s.label)}</text>`).join("")}</svg>`;
}
function barList(items,raw){
  const max=Math.max(1,...items.map(i=>i.value));
  return `<div style="display:grid;gap:11px">${items.map((it,i)=>`<div>
    <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.6px;margin-bottom:5px">
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.label)}</span>
      <b>${raw?num(it.value):money(it.value)}</b></div>
    <div class="bar"><i style="width:${(it.value/max*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}"></i></div>
  </div>`).join("")}</div>`;
}
function donut(items){
  const total=sum(items,i=>i.value)||1; let a=-Math.PI/2;
  const R=62,r=40,cx=80,cy=80;
  const arcs=items.map((it,i)=>{const ang=(it.value/total)*Math.PI*2,b=a+ang,big=ang>Math.PI?1:0;
    const p=`M${cx+R*Math.cos(a)} ${cy+R*Math.sin(a)} A${R} ${R} 0 ${big} 1 ${cx+R*Math.cos(b)} ${cy+R*Math.sin(b)}
      L${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)} A${r} ${r} 0 ${big} 0 ${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)} Z`;
    a=b; return `<path d="${p}" fill="${COLORS[i%COLORS.length]}"><title>${esc(it.label)}: ${money(it.value)}</title></path>`;}).join("");
  return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 160 160" style="width:160px;height:160px;flex:none">${arcs}
      <text x="80" y="77" text-anchor="middle" font-size="11" fill="#8794A3">${t("total")}</text>
      <text x="80" y="95" text-anchor="middle" font-size="14" font-weight="800" fill="#0A1B2E">${money(total)}</text></svg>
    <div style="display:grid;gap:8px;flex:1;min-width:150px">${items.map((it,i)=>`
      <div style="display:flex;align-items:center;gap:9px;font-size:12.6px">
        <i style="width:10px;height:10px;border-radius:3px;background:${COLORS[i%COLORS.length]};flex:none"></i>
        <span style="flex:1">${esc(it.label)}</span><b>${(it.value/total*100).toFixed(0)}%</b></div>`).join("")}</div></div>`;
}

function accDashboard(role){
  const y=NOW().getFullYear(), inv=DB.d.invoices;
  const ytd=inv.filter(i=>new Date(i.issued)>=sYear(NOW()));
  const unpaid=inv.filter(i=>!i.paid), over=unpaid.filter(i=>new Date(i.due)<NOW());
  const mN=[],mV=[];
  for(let m=0;m<=NOW().getMonth();m++){
    const f=new Date(y,m,1),t2=new Date(y,m+1,0,23,59,59);
    const iv=inv.filter(i=>{const d=new Date(i.issued);return d>=f&&d<=t2;});
    const lab=f.toLocaleDateString(cfg()._locale,{month:"short"});
    mN.push({label:lab,value:sum(iv,x=>x.net)}); mV.push({label:lab,value:sum(iv,x=>x.vat)});
  }
  const recent=inv.slice().sort((a,b)=>new Date(b.issued)-new Date(a.issued)).slice(0,10);
  return shell(role,"dashboard",t("boDashboard"),`
    <div class="note n-i">${I("lock")}<span>${t("accNotice")}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="kl">${I("bank")}${t("net")} · ${y}</div><div class="kv">${money(sum(ytd,i=>i.net))}</div>
        <div class="kd">${ytd.length} ${t("boInvoices")}</div></div>
      <div class="kpi g"><div class="kl">${I("perc")}${t("vatCollected")} · ${y}</div><div class="kv">${money(sum(ytd,i=>i.vat))}</div>
        <div class="kd"><a href="${BASE[role]}vat" style="text-decoration:underline">${t("vatDecl")}</a></div></div>
      <div class="kpi o"><div class="kl">${I("wallet")}${t("gross")} · ${y}</div><div class="kv">${money(sum(ytd,i=>i.total))}</div></div>
      <div class="kpi ${over.length?"d":"w"}"><div class="kl">${I("clock")}${t("unpaid")}</div>
        <div class="kv">${money(sum(unpaid,i=>i.total))}</div>
        <div class="kd">${unpaid.length} ${t("boInvoices")} · ${over.length} ${t("overdue")}</div></div>
    </div>
    <div class="gr2">
      <div class="card"><div class="chead"><h3>${t("net")} — ${y}</h3></div><div class="cbody">${lineChart(mN,250)}</div></div>
      <div class="card"><div class="chead"><h3>${t("vatCollected")}</h3>
        <a class="btn btn-line btn-sm" href="${BASE[role]}vat">${t("view")}</a></div>
        <div class="cbody">${barList(mV.filter(x=>x.value>0))}</div></div></div>
    <div class="card"><div class="chead"><h3>${t("boInvoices")}</h3>
      <a class="btn btn-line btn-sm" href="${BASE[role]}invoices">${t("view")}</a>
      <button class="btn btn-line btn-sm" data-csv="invoices">${I("down")}${t("export")}</button></div>
      <div class="scrollx"><table class="d"><thead><tr><th>${t("invoiceNo")}</th><th>${t("customer")}</th>
        <th>${t("issued")}</th><th class="n">${t("net")}</th><th class="n">${t("vatAmt")}</th>
        <th class="n">${t("gross")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>
        ${recent.map(i=>{const c=DB.d.customers.find(x=>x.id===i.customerId)||{};
          return `<tr><td class="mono">${esc(i.id)}</td><td>${esc(c.company||"—")}</td><td>${fdate(i.issued)}</td>
          <td class="n">${money2(i.net)}</td><td class="n">${money2(i.vat)}</td><td class="n">${money2(i.total)}</td>
          <td><span class="chip ${i.paid?"c-g":"c-y"}">${i.paid?t("paid"):t("unpaid")}</span></td>
          <td><a class="btn btn-line btn-xs" href="#/invoice/${i.id}">${I("eye")}</a></td></tr>`;}).join("")}
      </tbody></table></div></div>`);
}

      stock:+f.stock||0,threshold:+f.threshold||4,lead:+f.lead||5,warranty:+f.warranty||36,
      name:nm,desc:de,specs,docs,video:f.video||"",featured:f.featured==="1",badge:f.badge||null,
      created:f.created||dstr(new Date()),

function boVat(role){
  const y=NOW().getFullYear(), rows=[];
  for(let m=0;m<12;m++){
    const f=new Date(y,m,1),t2=new Date(y,m+1,0,23,59,59);
    const iv=DB.d.invoices.filter(i=>{const d=new Date(i.issued);return d>=f&&d<=t2;});
    if(!iv.length&&f>NOW()) continue;
    rows.push({label:f.toLocaleDateString(cfg()._locale,{month:"long",year:"numeric"}),n:iv.length,
      net:sum(iv,i=>i.net),vat:sum(iv,i=>i.vat),gross:sum(iv,i=>i.total),
      rates:[.25,.21,.20].map(r=>sum(iv.filter(i=>Math.abs(i.vatRate-r)<.001),i=>i.vat))});

/* ---------- CSV ---------- */
function csv(rows,name){
  const body=rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob=new Blob(["﻿"+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name+".csv";
  document.body.appendChild(a); a.click(); a.remove(); toast(name+".csv");
}
function exportCsv(kind){
  const d=DB.d;
  if(kind==="orders") csv([["Order","Date","Customer","Company","Country","Status","Payment","Carrier","Net","VAT","Total"]]
    .concat(d.orders.map(o=>[o.id,dstr(o.date),o.customer.name,o.customer.company,o.customer.country,o.status,
      o.payment,o.carrier,o.net,o.vat,o.total])),"orders");
  else if(kind==="products") csv([["SKU","Name","Category","Brand","Price EUR","Cost","Stock","Threshold","Sold"]]
    .concat(prods().map(p=>[p.sku,L(p.name),p.cat,p.brand,p.price,p.cost,p.stock,p.threshold,p.sold||0])),"products");
  else if(kind==="stock") csv([["SKU","Name","Stock","Threshold","Status","Value EUR"]]
    .concat(prods().map(p=>[p.sku,L(p.name),p.stock,p.threshold,stockState(p),p.stock*p.cost])),"stock");
  else if(kind==="invoices") csv([["Invoice","Order","Issued","Due","Net","VAT rate","VAT","Gross","Paid"]]
    .concat(d.invoices.map(i=>[i.id,i.orderId,dstr(i.issued),dstr(i.due),i.net,i.vatRate,i.vat,i.total,i.paid?"yes":"no"])),"invoices");
  else if(kind==="customers") csv([["ID","Company","Name","Email","Phone","City","Country","Joined"]]
    .concat(d.customers.map(c=>[c.id,c.company,c.name,c.email,c.phone,c.city,c.country,c.joined])),"customers");
  else if(kind==="vat"){
    const y=NOW().getFullYear(),rows=[["Period","Invoices","Net EUR","VAT EUR","Gross EUR"]];
    for(let m=0;m<12;m++){const f=new Date(y,m,1),t2=new Date(y,m+1,0,23,59,59);
      const iv=d.invoices.filter(i=>{const dt=new Date(i.issued);return dt>=f&&dt<=t2;});
      rows.push([y+"-"+pad(m+1),iv.length,sum(iv,i=>i.net).toFixed(2),sum(iv,i=>i.vat).toFixed(2),sum(iv,i=>i.total).toFixed(2)]);}
    csv(rows,"vat-"+y);
  }
  else if(kind==="revenue") csv([["Month","Orders","Net revenue EUR"]]
    .concat(monthly(12).map(m=>[dstr(m.full).slice(0,7),m.count,m.value.toFixed(2)])),"revenue");
  else if(kind==="audit") csv([["Timestamp","User","Action","Detail"]]
    .concat(d.audit.map(a=>[a.ts,a.user,a.act,a.detail])),"audit");
}

<script>
/* ================================================================

const TECHF=[
 ["manufacturer",L3("Tillverkare / Varumärke","Manufacturer / Brand","Üretici / Marka"),"text"],
 ["model",       L3("Modell","Model","Model"),"text"],

const TECHDOCS=[
 ["manual",    L3("Bruksanvisning","User manual","Kullanım kılavuzu")],
 ["datasheet", L3("Tekniskt datablad","Technical data sheet","Teknik veri sayfası")],
 ["conformity",L3("Försäkran om överensstämmelse","Declaration of conformity","Uygunluk beyanı")]
];
const TECH_TXT={
 sv:{title:"Tekniska specifikationer",docs:"Tekniska dokument",yes:"Ja",no:"Nej",ph1:"1-fas",ph3:"3-fas",
     req:"Fyll i alla obligatoriska tekniska fält:",upload:"Ladda upp PDF",none:"Ingen fil",
     hint:"Obligatoriskt — visas automatiskt i produktens tekniska tabell.",
     big:"PDF:en är för stor (max ca 2 MB). Lägg filen i assets/docs och ange sökvägen."},
 en:{title:"Technical specifications",docs:"Technical documents",yes:"Yes",no:"No",ph1:"1-phase",ph3:"3-phase",
     req:"Please complete all required technical fields:",upload:"Upload PDF",none:"No file",
     hint:"Required — shown automatically in the product's technical table.",
     big:"PDF too large (max ~2 MB). Put the file in assets/docs and enter its path."},
 tr:{title:"Teknik Özellikler",docs:"Teknik dokümanlar",yes:"Var",no:"Yok",ph1:"1 faz",ph3:"3 faz",
     req:"Lütfen tüm zorunlu teknik alanları doldurun:",upload:"PDF yükle",none:"Dosya yok",
     hint:"Zorunlu — ürün sayfasındaki teknik tabloda otomatik gösterilir.",
     big:"PDF çok büyük (en fazla ~2 MB). Dosyayı assets/docs klasörüne koyup yolunu yazın."}
};
const TT=k=>(TECH_TXT[S.lang]||TECH_TXT.tr)[k];
const emptyTech=()=>{const o={};TECHF.forEach(f=>o[f[0]]="");return o;};
const emptyTechDocs=()=>({manual:"",datasheet:"",conformity:""});

/* mevcut ürünlere teknik alanları doldur (veri kaybı yok) */
function techSetup(){
  let ch=false;
  const grab=(p,re)=>{
    const s=(p.specs||[]).find(x=>re.test(L(x.k)||"")||re.test((x.k&&x.k.en)||"")||re.test((x.k&&x.k.tr)||""));
    return s?String(s.v):"";
  };
  DB.d.products.forEach(p=>{
    if(!p.techDocs){p.techDocs=emptyTechDocs();ch=true;}
    if(!p.tech){
      const b=brand(p.brand);
      const volt=grab(p,/spänning|voltage|voltaj/i);
      p.tech={...emptyTech(),
        manufacturer:b?b.name:"",
        model:p.sku||"",
        ce:"yes",
        power:grab(p,/effekt|power|güç/i),
        voltage:volt,
        phase:/400|3N~|3~/.test(volt)?"3":"1",
        frequency:"50 Hz",
        current:"",
        energy:grab(p,/energi|energy|enerji/i),
        dims:grab(p,/mått|dimension|ölçü/i),
        weight:grab(p,/vikt|weight|ağırlık/i),
        capacity:grab(p,/kapacitet|capacity|kapasite|volym|hacim|skål|bowl|kazan/i),
        material:grab(p,/material|malzeme/i)||"AISI 304",
        warrantyPeriod:String(p.warranty||36)};
      ch=true;
    }
  });
  if(ch) DB.save();
}

      '<button type="button" class="'+btn+'" data-pdfup="'+k+'">'+I("upload")+TT("upload")+'</button></div>'+
      '<div data-pdfname="'+k+'" style="font-size:12px;color:var(--steel-700);margin-top:5px">'+esc(nm)+'</div></div>';

    'margin:24px 0 6px;padding-top:16px;border-top:2px solid var(--steel-200)">'+esc(TT("title"))+'</h4>'+

    '<h4 style="font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel-700);'+

/* form -> nesne; eksik zorunlu alan varsa null döner ve uyarır */
function readTechForm(f){
  const tech={},miss=[];
  TECHF.forEach(function(row){
    const v=String(f["tech_"+row[0]]||"").trim();
    tech[row[0]]=v; if(!v) miss.push(L(row[1]));
  });
  if(miss.length){ toast(TT("req")+" "+miss.slice(0,4).join(", ")+(miss.length>4?"…":""),"err"); return null; }
  const docs={}; TECHDOCS.forEach(function(row){ docs[row[0]]=String(f["doc_"+row[0]]||"").trim(); });
  return {tech:tech,docs:docs};
}
/* ---------- PDF yükleme (yalnızca yetkili panelde) ---------- */
let _pdfInput=null;
function pdfPicker(){
  if(_pdfInput) return _pdfInput;
  _pdfInput=document.createElement("input");
  _pdfInput.type="file"; _pdfInput.accept="application/pdf,.pdf"; _pdfInput.style.display="none";
  document.body.appendChild(_pdfInput);
  return _pdfInput;
}
function uploadPdf(key){
  if(typeof canEditMedia==="function" && !canEditMedia()) return;
  const inp=pdfPicker(); inp.value="";
  inp.onchange=function(){
    const file=inp.files&&inp.files[0]; if(!file) return;
    if(file.size>2200000){ toast(TT("big"),"err"); return; }
    const fr=new FileReader();
    fr.onload=function(){

function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  text=text.replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(x=>String(x).trim())).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]==null?"":String(r[i]).trim())); return o; });
}

/* ---------- teknik alan çıkarımı ---------- */
function techFromText(txt){
  const T=emptyTech(); const extra=[];
  if(!txt) return {T,extra};
  const t=txt.replace(/\s+/g," ");
  let m=t.match(/Dimensions?\s*:?\s*(\d{2,4}\s*[x×*]\s*\d{2,4}\s*[x×*]\s*H?\s*\d{2,4}\s*mm)/i);
  if(m) T.dims=m[1].trim();
  else{
    const w=t.match(/Width\s*:?\s*(\d{2,4})\s*mm/i),d=t.match(/Depth\s*:?\s*(\d{2,4})\s*mm/i),h=t.match(/Height\s*:?\s*(\d{2,4})\s*mm/i);
    if(w&&d&&h) T.dims=w[1]+" × "+d[1]+" × "+h[1]+" mm";
  }
  m=t.match(/(?:Total\s+)?Power\s*:?\s*([\d.,]+\s*kW)/i)||t.match(/\b([\d.,]+\s*kW)\b/i);
  if(m) T.power=m[1].trim();
  m=t.match(/\b(\d{3}\s*[-/]?\s*\d{0,3}\s*V(?:olt)?)\b/i);
  if(m){ T.voltage=m[1].trim(); T.phase=/400/.test(m[1])?"3":"1"; T.frequency="50 Hz"; }
  m=t.match(/\b([\d.,]+\s*kg)\b/i); if(m) T.weight=m[1];
  m=t.match(/(?:Tank\s+)?Capacity\s*:?\s*([\d.,]+(?:\s*[x×*]\s*[\d.,]+)*\s*(?:L|kg|GN|pcs)?)/i);
  if(m) T.capacity=m[1].replace(/\s+/g," ").trim().replace(/[:\-\s]+$/,"");
  if(/stainless steel|aisi\s*30\d|inox/i.test(t)) T.material="AISI 304";
  m=t.match(/Temperature\s*range\s*:?\s*([^.;]{3,28})/i);
  if(m) extra.push({k:{sv:"Temperaturområde",en:"Temperature range",tr:"Sıcaklık aralığı"},v:m[1].trim()});
  m=t.match(/\b(R\d{3}[a-z]?)\b/);
  if(m) extra.push({k:{sv:"Köldmedium",en:"Refrigerant",tr:"Soğutucu akışkan"},v:m[1]});
  return {T,extra};
}
/* ---------- satırları ürüne dönüştür ---------- */
function rowsToProducts(rows,brandName){
  const get=(r,keys)=>{ for(const k of keys){ for(const kk in r){ if(kk.toLowerCase().replace(/[^a-z]/g,"")===k){ return r[kk]; } } } return ""; };
  const out=[],newCats={},newSubs={};
  const have=new Set(DB.d.products.map(p=>p.sku.toLowerCase()));
  rows.forEach((r,i)=>{
    const full=get(r,["name","productname","title","urunadi","ürünadı"]).trim();
    if(!full) return;
    const bar=full.indexOf("|");
    const seg=bar>0?full.slice(0,bar).trim():full;
    let pname=bar>0?full.slice(bar+1).trim():full;
    if(!/[A-Za-zÀ-ÿ]{3,}/.test(pname)) pname=seg+" — "+pname;
    const cls=classifySeg(seg), cid=cls.cat, sname=cls.sub, sid=cid+"-"+slug(sname[1]);
    if(!byId(DB.d.categories,cid)&&!newCats[cid]){
      const meta=MAIN_META[cid]||["box",[seg,seg,seg],["","",""]];
      newCats[cid]={id:cid,icon:meta[0],name:{sv:meta[1][0],en:meta[1][1],tr:meta[1][2]},
        desc:{sv:meta[2][0],en:meta[2][1],tr:meta[2][2]},image:"assets/cat-"+cid+".jpg",
        order:DB.d.categories.length+Object.keys(newCats).length,visible:true};
    }
    if(!byId(DB.d.categories,sid)&&!newSubs[sid]){
      newSubs[sid]={id:sid,parent:cid,icon:"box",name:{sv:sname[0],en:sname[1],tr:sname[2]},
        desc:{sv:"",en:"",tr:""},image:"",order:0,visible:true};
    }
    let sku=(get(r,["sku","artikelnr","urunkodu","ürünkodu","code"])||"").trim()||("PG-"+Date.now().toString(36)+i);
    if(have.has(sku.toLowerCase())) return;           /* aynı ürün kodu tekrar aktarılmaz */
    have.add(sku.toLowerCase());
    const short=get(r,["shortdescription","kisaaciklama"]);
    const long_=get(r,["description","aciklama","açıklama"]);
    const desc=(long_||short||"").slice(0,600);
    const tx=techFromText(short+" "+long_);
    tx.T.manufacturer=brandName; tx.T.model=sku;
    const imgs=(get(r,["allimageurls","images","gorseller"])||get(r,["imageurl","image","gorsel"])||"")
      .split(/[;|]/).map(x=>x.trim()).filter(Boolean).slice(0,4);
    const price=Math.round(parseFloat(String(get(r,["price","fiyat"])).replace(",","."))||0);
    out.push({id:"i-"+slug(sku)+"-"+i.toString(36),sku,cat:cid,sub:sid,brand:slug(brandName),
      name:{en:pname.slice(0,120)},desc:{en:desc},
      price,cost:Math.round(price*.62),stock:Math.round(parseFloat(get(r,["stock","stok","quantity"]))||0),
      threshold:3,lead:7,warranty:24,images:imgs,video:"",docs:[],
      tech:tx.T,specs:tx.extra,campaign:{on:false,percent:0,until:""},
      featured:false,badge:null,created:dstr(new Date()),rating:4.6,sold:0,hidden:false,salePrice:0});
  });
  return {products:out,cats:Object.values(newCats),subs:Object.values(newSubs)};
}
/* ---------- içe aktarımı uygula ---------- */
function applyImport(res,brandName){
  const bid=slug(brandName);
  if(!byId(DB.d.brands,bid))
    DB.d.brands.push({id:bid,name:brandName,country:"EU",
      desc:{sv:"Professionell köksutrustning",en:"Professional kitchen equipment",tr:"Profesyonel mutfak ekipmanları"},
      image:"assets/brand-"+bid+".jpg"});
  res.cats.forEach(c=>{ if(!byId(DB.d.categories,c.id)) DB.d.categories.push(c); });
  res.subs.forEach(c=>{ if(!byId(DB.d.categories,c.id)) DB.d.categories.push(c); });
  res.products.forEach(p=>DB.d.products.push(p));

}
/* ================================================================
   KATALOG DEPOSU
   Hazır katalog (assets/catalog.js) tarayıcı deposuna YAZILMAZ.
   Bellekte birleştirilir; yalnızca panelden değiştirilen ürünler ve
   silinenler saklanır. Böylece on binlerce ürün desteklenir.
   ================================================================ */
let BASE_SIG={};
function catalogMount(){
  const C=window.PGC_CATALOG; if(!C) return;
  DB.d.patch=DB.d.patch||{}; DB.d.removed=DB.d.removed||[];
  const rm=new Set(DB.d.removed), have=new Set(DB.d.products.map(p=>p.id));
  BASE_SIG={};
  C.products.forEach(function(bp){
    if(rm.has(bp.id)||have.has(bp.id)) return;
    const merged=Object.assign({},bp,DB.d.patch[bp.id]||{});
    merged._c=1;
    DB.d.products.push(merged);
    BASE_SIG[bp.id]=JSON.stringify(merged);
  });
}
function removeProduct(id){
  const p=prod(id);
  if(p&&p._c){ DB.d.removed=DB.d.removed||[]; if(DB.d.removed.indexOf(id)<0) DB.d.removed.push(id); }
  if(DB.d.patch) delete DB.d.patch[id];
  DB.d.products=DB.d.products.filter(x=>x.id!==id);
  DB.save();
}
const _dbSaveOrig=DB.save.bind(DB);
DB.save=function(){
  const all=this.d.products, user=[], patch={};
  for(let i=0;i<all.length;i++){
    const p=all[i];
    if(p._c){
      const sig=JSON.stringify(p);
      if(sig!==BASE_SIG[p.id]){ const c=Object.assign({},p); delete c._c; patch[p.id]=c; }
    } else user.push(p);
  }
  const keep=this.d.products, keepPatch=this.d.patch;
  this.d.products=user; this.d.patch=patch;
  try{ _dbSaveOrig(); } finally { this.d.products=keep; this.d.patch=keepPatch; }
};
/* ---------- ilk açılışta kategori/marka kaydı ---------- */
function catalogSetup(){
  const C=window.PGC_CATALOG;
  if(!C) return;
  if(DB.d.catalogImported===C.v){ catalogMount(); return; }
  const bid=C.brand.id;
  if(!byId(DB.d.brands,bid))
    DB.d.brands.push({id:bid,name:C.brand.name,country:C.brand.country,
      desc:{sv:C.brand.desc[0],en:C.brand.desc[1],tr:C.brand.desc[2]},image:"assets/brand-"+bid+".jpg"});
  C.cats.forEach((c,i)=>{ if(!byId(DB.d.categories,c.id))
    DB.d.categories.push({id:c.id,icon:c.icon,name:{sv:c.name[0],en:c.name[1],tr:c.name[2]},
      desc:{sv:c.desc[0],en:c.desc[1],tr:c.desc[2]},image:"assets/cat-"+c.id+".jpg",
      order:DB.d.categories.length+i,visible:true}); });
  C.subs.forEach(sb=>{ if(!byId(DB.d.categories,sb.id))
    DB.d.categories.push({id:sb.id,parent:sb.parent,icon:"box",
      name:{sv:sb.name[0],en:sb.name[1],tr:sb.name[2]},desc:{sv:"",en:"",tr:""},
      image:"",order:0,visible:true}); });
  DB.d.catalogImported=C.v;
  DB.d.patch={}; DB.d.removed=[];
  DB.save();
  catalogMount();
}

        Ürün adındaki <b>"Kategori | Ürün adı"</b> biçimi otomatik ana/alt kategoriye ayrılır.
        Teknik alanlar açıklamadan çıkarılır; bulunamayanlar boş kalır ve panelden düzenlenebilir.</span></div>
      <div class="f"><label>Marka adı</label><input id="bulkbrand" value="Unninox"></div>
      <div class="dropzone" id="bulkdrop"><b>CSV dosyasını seçin</b>
        <small>Aynı ürün kodu zaten varsa atlanır — mevcut ürünler bozulmaz</small></div>
      <div id="bulkinfo" style="margin-top:16px"></div>
    </div>
    <div class="mf"><button class="btn btn-line btn-sm" data-close>${t("cancel")}</button>
      <button class="btn btn-primary btn-sm" id="bulkgo" disabled>${I("check")} İçe aktar</button></div></div>`);
  let parsed=null;
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv"; inp.style.display="none";
  document.body.appendChild(inp);
  $("#bulkdrop").onclick=()=>inp.click();
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const rows=parseCSV(fr.result);
        parsed=rowsToProducts(rows,$("#bulkbrand").value.trim()||"Unninox");
        const byCat={}; parsed.products.forEach(p=>byCat[p.cat]=(byCat[p.cat]||0)+1);
        $("#bulkinfo").innerHTML=`<div class="note n-o">${I("checkc")}<span>
          <b>${parsed.products.length}</b> yeni ürün · <b>${parsed.cats.length}</b> yeni ana kategori ·
          <b>${parsed.subs.length}</b> yeni alt kategori<br>
          <span style="font-size:13px">${Object.entries(byCat).map(([c,n])=>
            esc(L((byId(DB.d.categories,c)||(parsed.cats.find(x=>x.id===c))||{name:{}}).name)||c)+": "+n).join(" · ")}</span>
          </span></div>`;
        $("#bulkgo").disabled=!parsed.products.length;
      }catch(e){ $("#bulkinfo").innerHTML=`<div class="note n-d">${I("alert")}<span>Dosya okunamadı: ${esc(e.message)}</span></div>`; }
    };
    fr.readAsText(f,"utf-8");
  };
  $("#bulkgo").onclick=()=>{
    if(!parsed) return;
    applyImport(parsed,$("#bulkbrand").value.trim()||"Unninox");
    DB.log(S.user&&S.user.name,"bulk.import",parsed.products.length+" ürün");
    closeModal(); toast(parsed.products.length+" ürün içe aktarıldı"); render();
  };
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-bulk]")){ e.preventDefault(); bulkImportModal(); }
});
</script>

/* ---------- kurulum: yeni alanlar (mevcut veriyi bozmaz) ---------- */
function owSetup(){
  const d=DB.d; let changed=false;
  if(!d.returns){
    d.returns=[]; const done=d.orders.filter(o=>o.status==="delivered").slice(-40);
    [[0,"Ürün hasarlı geldi","refunded"],[7,"Yanlış model gönderildi","approved"],
     [14,"Müşteri vazgeçti","requested"],[21,"Teknik arıza","refunded"]].forEach((r,i)=>{
      const o=done[done.length-1-(r[0])]; if(!o) return;
      d.returns.push({id:"IA-"+pad(1000+i,4),orderId:o.id,customerId:o.customerId,
        company:o.customer.company,date:new Date(Date.now()-r[0]*864e5).toISOString(),
        reason:r[1],amount:+(o.total*(i%2?0.5:1)).toFixed(2),status:r[2]});
    });
    changed=true;
  }
  if(!d.invites){ d.invites=[]; changed=true; }
  d.products.forEach(p=>{
    if(p.hidden===undefined){p.hidden=false;changed=true;}
    if(p.salePrice===undefined){p.salePrice=0;changed=true;}
  });
  if(!d.users.some(u=>u.role==="owner")){
    d.users.unshift({id:"U-OWNER",name:"Süper Admin",email:"owner@pirogastro.se",pass:"piro2026",
      role:"owner",active:true,last:new Date().toISOString(),perms:null});
    changed=true;
  }
  if(changed) DB.save();
}
const owIsOwner=()=>!!(S.user&&S.user.role==="owner");
function owUserPerms(){
  if(!S.user||S.user.role==="owner"||S.user.role==="super") return null;
  const u=DB.d.users.find(x=>x.id===S.user.id);
  return (u&&u.perms&&u.perms.length)?u.perms:null;
}

  return {

/* ---------- 9. MUHASEBE ÖZETİ ---------- */
function owAccounting(){
  const y=NOW().getFullYear();
  const inv=DB.d.invoices.filter(i=>new Date(i.issued)>=sYear(NOW()));
  const yOrders=between(okOrders(),sYear(NOW()),NOW());
  const ret=DB.d.returns.filter(r=>r.status==="refunded");
  const rows=[];
  for(let m=0;m<=NOW().getMonth();m++){
    const f=new Date(y,m,1),t2=new Date(y,m+1,0,23,59,59);
    const iv=DB.d.invoices.filter(i=>{const d=new Date(i.issued);return d>=f&&d<=t2;});
    rows.push({label:f.toLocaleDateString(cfg()._locale,{month:"long"}),n:iv.length,
      net:sum(iv,i=>i.net),vat:sum(iv,i=>i.vat),gross:sum(iv,i=>i.total)});
  }
  return owShell("accounting","Muhasebe özeti",`
    <div class="ow-stats">
      <div class="ow-stat blue"><div class="l">${I("bank")}Net ciro (${y})</div>
        <div class="v">${money(sum(inv,i=>i.net))}</div><div class="s">KDV hariç</div></div>
      <div class="ow-stat gold"><div class="l">${I("perc")}Hesaplanan KDV</div>
        <div class="v">${money(sum(inv,i=>i.vat))}</div><div class="s">${inv.length} fatura</div></div>
      <div class="ow-stat green"><div class="l">${I("wallet")}Brüt ciro</div>
        <div class="v">${money(sum(inv,i=>i.total))}</div><div class="s">KDV dahil</div></div>
      <div class="ow-stat red"><div class="l">${I("refresh")}İade edilen</div>
        <div class="v">${money(sum(ret,r=>r.amount))}</div><div class="s">${ret.length} iade</div></div>
    </div>
    <div class="ow-card"><h2>${I("chart")}Aylık özet ${y}
      <span class="right"><button class="ow-btn sm" data-csv="vat">${I("down")}KDV raporu (CSV)</button>
      <button class="ow-btn sm" onclick="window.print()">${I("print")}Yazdır</button></span></h2>
      <div class="ow-scroll"><table class="ow-t"><thead><tr><th>Ay</th><th class="num">Fatura</th>
        <th class="num">Net</th><th class="num">KDV</th><th class="num">Brüt</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td><b>${esc(r.label)}</b></td><td class="num">${r.n}</td>
          <td class="num">${money(r.net)}</td><td class="num">${money(r.vat)}</td>
          <td class="num">${money(r.gross)}</td></tr>`).join("")}
      </tbody><tfoot><tr style="background:#F7F9FB;font-weight:800">
        <td>TOPLAM</td><td class="num">${sum(rows,r=>r.n)}</td><td class="num">${money(sum(rows,r=>r.net))}</td>
        <td class="num">${money(sum(rows,r=>r.vat))}</td><td class="num">${money(sum(rows,r=>r.gross))}</td></tr></tfoot>
      </table></div></div>
    <div class="ow-card"><h2>${I("box")}Satış özeti</h2><div class="ow-cbody">
      <div class="ow-stats" style="margin:0">
        <div class="ow-stat"><div class="l">Sipariş adedi</div><div class="v">${yOrders.length}</div></div>
        <div class="ow-stat"><div class="l">Satılan ürün</div><div class="v">${sum(yOrders,o=>sum(o.lines,l=>l.qty))}</div></div>
        <div class="ow-stat"><div class="l">Ortalama sepet</div>
          <div class="v">${money(sum(yOrders,rev)/Math.max(1,yOrders.length))}</div></div>
      </div></div></div>`);
}
