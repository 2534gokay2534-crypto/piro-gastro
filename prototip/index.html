<script>
/* ================================================================
   SÜPER ADMIN — formlar, davet akışı, olaylar
   ================================================================ */
let owDraft=null;          /* düzenlenen ürünün çalışma kopyası */
let owPicker=null;         /* çoklu görsel seçici */

function owEnsurePicker(){
  if(owPicker) return owPicker;
  owPicker=document.createElement("input");
  owPicker.type="file"; owPicker.accept="image/*"; owPicker.multiple=true; owPicker.style.display="none";
  document.body.appendChild(owPicker);
  owPicker.addEventListener("change",async e=>{
    const files=[...(e.target.files||[])]; if(!files.length||!owDraft) return;
    for(const f of files){
      try{
        const url=await fileToDataUrl(f,1600,.82);
        owDraft.images.push(url);
        DB.d.media.unshift({id:uid("M"),name:f.name,src:url,added:new Date().toISOString()});
      }catch(err){}
    }
    DB.d.media=DB.d.media.slice(0,120);
    owPicker.value=""; owProductForm(null,true);
  });
  return owPicker;
}
/* ---------- ÜRÜN FORMU ---------- */
function owProductForm(id,keepDraft){
  if(!keepDraft){
    if(id){ const p=prod(id); if(!p) return;
      owDraft=JSON.parse(JSON.stringify(p)); owDraft.__id=p.id; }
    else { owDraft={__id:null,sku:"",cat:(cats()[0]||{}).id||"",brand:(brands()[0]||{}).id||"",
      price:0,salePrice:0,cost:0,stock:0,threshold:4,lead:5,warranty:36,
      tech:emptyTech(),techDocs:emptyTechDocs(),
      name:{sv:"",en:"",tr:""},desc:{sv:"",en:"",tr:""},specs:[],images:[],video:"",docs:[],
      campaign:{on:false,percent:0,label:{sv:"Kampanj",en:"Campaign",tr:"Kampanya"},until:""},
      featured:false,hidden:false,badge:null,created:dstr(new Date()),rating:4.5,sold:0}; }
  }
  const d=owDraft;
  openModal(`<div class="modal xw"><form id="owprodform"><div class="mh">
    <h3 style="font-size:22px">${d.__id?"Ürünü düzenle":"Yeni ürün ekle"}</h3>
    <button type="button" class="x" data-close>${I("x")}</button></div>
    <div class="mb" style="font-size:16px">
      <div class="ow-f"><label>Ürün fotoğrafları</label>
        <div class="ow-drop" id="owdrop"><b>${I("upload")} Fotoğraf yükle</b>
          <span>Tıklayın veya sürükleyip bırakın — birden fazla seçebilirsiniz</span></div>
        ${d.images.length?`<div class="ow-pics">${d.images.map((im,i)=>`<div class="ow-pic">
          ${slot(im,{ratio:"",cls:"light",label:"",code:""})}
          <button type="button" data-owdelpic="${i}">${I("x")}</button>
          ${i===0?'<span style="position:absolute;left:6px;bottom:6px;background:#C8A24A;color:#0A1B2E;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px">KAPAK</span>':""}
        </div>`).join("")}</div>`:""}
      </div>
      <div class="ow-f"><label>Ürün adı *</label>
        <input required name="name" value="${esc(d.name.tr||d.name.en||d.name.sv||"")}" placeholder="Örn: Pizza tabağı 33 cm">
        <div class="hint">Üç dilde de aynı yazılır. Farklı yazmak isterseniz aşağıdaki alanları doldurun.</div></div>
      <details style="margin-bottom:20px"><summary style="cursor:pointer;font-size:14px;color:#5A6674;padding:6px 0">
        Diğer dillerde ad (isteğe bağlı)</summary>
        <div class="ow-g2" style="margin-top:12px">
          <div class="ow-f"><label>İsveççe</label><input name="name_sv" value="${esc(d.name.sv||"")}"></div>
          <div class="ow-f"><label>İngilizce</label><input name="name_en" value="${esc(d.name.en||"")}"></div>
        </div></details>
      <div class="ow-f"><label>Açıklama</label>
        <textarea name="desc" placeholder="Ürünün kısa tanıtımı">${esc(d.desc.tr||d.desc.en||d.desc.sv||"")}</textarea></div>
      <div class="ow-g3">
        <div class="ow-f"><label>Fiyat (EUR) *</label><input required type="number" step="1" min="0" name="price" value="${d.price}"></div>
        <div class="ow-f"><label>İndirimli fiyat</label><input type="number" step="1" min="0" name="salePrice" value="${d.salePrice||0}">
          <div class="hint">Boş veya 0 = indirim yok</div></div>
        <div class="ow-f"><label>Stok adedi</label><input type="number" min="0" name="stock" value="${d.stock}"></div>
      </div>
      <div class="ow-g3">
        <div class="ow-f"><label>Kategori</label><select name="cat">
          ${cats().map(c=>`<option value="${c.id}" ${d.cat===c.id?"selected":""}>${c.parent?"— ":""}${esc(L(c.name))}</option>`).join("")}</select></div>
        <div class="ow-f"><label>Marka</label><select name="brand">
          ${brands().map(b=>`<option value="${b.id}" ${d.brand===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div>
        <div class="ow-f"><label>Ürün kodu</label><input name="sku" value="${esc(d.sku)}" placeholder="Otomatik">
          <div class="hint">Boş bırakırsanız otomatik üretilir</div></div>
      </div>
      <div class="ow-g3">
        <div class="ow-f"><label>Kritik stok seviyesi</label><input type="number" min="0" name="threshold" value="${d.threshold}"></div>
        <div class="ow-f"><label>Alış fiyatı (EUR)</label><input type="number" min="0" name="cost" value="${d.cost}"></div>
        <div class="ow-f"><label>Görünürlük</label><select name="hidden">
          <option value="0" ${!d.hidden?"selected":""}>Sitede yayında</option>
          <option value="1" ${d.hidden?"selected":""}>Gizli</option></select></div>
      </div>
      <label class="ow-chk ${d.featured?"on":""}" style="max-width:320px">
        <input type="checkbox" name="featured" ${d.featured?"checked":""}> Ana sayfada öne çıkar</label>
      ${techFormHTML(d,"ow")}
    </div>
    <div class="mf"><button type="button" class="ow-btn" data-close>Vazgeç</button>
      <button class="ow-btn p" type="submit" style="padding:14px 26px;font-size:16px">${I("check")}Kaydet</button></div>
  </form></div>`);
  const drop=$("#owdrop");
  drop.onclick=()=>{owEnsurePicker().click();};
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor="#C8A24A";};
  drop.ondragleave=()=>{drop.style.borderColor="";};
  drop.ondrop=async e=>{e.preventDefault();drop.style.borderColor="";
    for(const f of [...e.dataTransfer.files]){
      try{const url=await fileToDataUrl(f,1600,.82); owDraft.images.push(url);
        DB.d.media.unshift({id:uid("M"),name:f.name,src:url,added:new Date().toISOString()});}catch(err){}}
    owProductForm(null,true);};
  $("#owprodform").addEventListener("submit",e=>{
    e.preventDefault();
    const f=Object.fromEntries(new FormData(e.target).entries());
    const nm=String(f.name||"").trim();
    if(!nm){toast("Ürün adı gerekli","err");return;}
    const price=+f.price||0, sale=+f.salePrice||0;
    if(sale&&sale>=price){toast("İndirimli fiyat, fiyattan düşük olmalı","err");return;}
    d.name={tr:nm,en:(f.name_en||"").trim()||nm,sv:(f.name_sv||"").trim()||nm};
    const ds=String(f.desc||"").trim();
    d.desc={tr:ds,en:d.desc.en||ds,sv:d.desc.sv||ds};
    if(!d.desc.en)d.desc.en=ds; if(!d.desc.sv)d.desc.sv=ds;
    d.price=price; d.salePrice=sale; d.stock=+f.stock||0; d.threshold=+f.threshold||4;
    d.cost=+f.cost||Math.round(price*.62); d.cat=f.cat; d.brand=f.brand;
    d.hidden=f.hidden==="1"; d.featured=!!f.featured;
    d.sku=String(f.sku||"").trim()||("PG-"+String(Date.now()).slice(-6));
    const tk=readTechForm(f); if(!tk) return;
    d.tech=tk.tech; d.techDocs=tk.docs;
    if(d.__id){
      const p=prod(d.__id); const keep=p.id;
      const copy={...d}; delete copy.__id;
      Object.assign(p,copy); p.id=keep;
      DB.log(S.user&&S.user.name,"owner.product.update",p.sku);
    }else{
      const copy={...d}; delete copy.__id;
      copy.id=uid("p");
      if(!copy.images.length) copy.images=[""];

    e.preventDefault();

          <div class="ow-f"><label>Para birimi</label><input name="currency" value="EUR"></div>
          <div class="ow-f"><label>Kur (1 EUR =)</label><input type="number" step="0.01" name="rate" value="1"></div>

document.addEventListener("click",e=>{

  const ed=q("[data-owedit]"); if(ed){owProductForm(ed.dataset.owedit);return;}

  if(hd){const p=prod(hd.dataset.owhide); if(p){p.hidden=!p.hidden;
    DB.log(S.user&&S.user.name,"owner.product.hide",p.sku+"="+p.hidden);
    DB.save();toast(p.hidden?"Ürün gizlendi":"Ürün yayında");render();} return;}
  const ft=q("[data-owfeat]");
  if(ft){const p=prod(ft.dataset.owfeat); if(p){p.featured=!p.featured;

  const dl=q("[data-owdel]");
  if(dl){const p=prod(dl.dataset.owdel);
    if(p&&confirm(esc(L(p.name))+" silinsin mi? Bu işlem geri alınamaz.")){
      DB.log(S.user&&S.user.name,"owner.product.delete",p.sku);
      removeProduct(p.id);toast("Ürün silindi");render();} return;}
  const rs=q("[data-owrestock]"); if(rs){owRestock(rs.dataset.owrestock);return;}
  const pd=q("[data-owpaid]");
  if(pd){const i=DB.d.invoices.find(x=>x.id===pd.dataset.owpaid);
    if(i){i.paid=true;DB.log(S.user&&S.user.name,"owner.invoice.paid",i.id);
      DB.save();toast("Ödeme kaydedildi");render();} return;}
  const rt=q("[data-owret]");
  if(rt){const [id,st]=rt.dataset.owret.split("|");
    const r=DB.d.returns.find(x=>x.id===id);
    if(r){r.status=st;DB.log(S.user&&S.user.name,"owner.return",id+" → "+st);
      DB.save();toast("İade güncellendi");render();} return;}
  const vo=q("[data-owvieworder]"); if(vo){orderModal(vo.dataset.owvieworder);return;}
  const pm=q("[data-owperm]");
  if(pm){const u=DB.d.users.find(x=>x.id===pm.dataset.owperm); if(!u)return;
    owPermPicker("Yetkiler — "+u.name,u.perms||[],f=>{
      u.perms=f.perms.length?f.perms:null;
      if(f.name)u.name=f.name; if(f.email)u.email=f.email;
      if(f.role)u.role=f.role==="staff"?"admin":f.role;
      DB.log(S.user&&S.user.name,"owner.user.perms",u.email);
      DB.save();closeModal();toast("Yetkiler güncellendi");render();});
    setTimeout(()=>{const fm=$("#owuform"); if(fm){fm.name.value=u.name;fm.email.value=u.email;
      [...fm.role.options].forEach(o=>{if(o.value===u.role)o.selected=true;});}},0);
    return;}
  const tg=q("[data-owtoggle]");
  if(tg){const u=DB.d.users.find(x=>x.id===tg.dataset.owtoggle);
    if(u){u.active=!u.active;DB.save();toast(u.active?"Hesap açıldı":"Hesap kapatıldı");render();} return;}
  const du=q("[data-owdeluser]");
  if(du){const u=DB.d.users.find(x=>x.id===du.dataset.owdeluser);
    if(u&&confirm(u.name+" silinsin mi?")){
      DB.d.users=DB.d.users.filter(x=>x.id!==u.id);
      DB.log(S.user&&S.user.name,"owner.user.delete",u.email);
      DB.save();toast("Kullanıcı silindi");render();} return;}
  const dlg=q("[data-owdellang]");
  if(dlg){ if(confirm("Bu dil silinsin mi? İçerikteki çevirileri kalır ama site dilinden kaldırılır.")){
      removeLanguage(dlg.dataset.owdellang); toast("Dil kaldırıldı"); render(); } return; }
  const cp=q("[data-owcopy]");
  if(cp){const url=owInviteUrl(cp.dataset.owcopy);
    if(navigator.clipboard) navigator.clipboard.writeText(url);
    toast("Link kopyalandı");return;}
  const di=q("[data-owdelinvite]");
  if(di){DB.d.invites=DB.d.invites.filter(x=>x.token!==di.dataset.owdelinvite);
    DB.save();toast("Davet silindi");render();return;}
  const ck=q(".ow-chk input");
  if(ck){setTimeout(()=>ck.closest(".ow-chk").classList.toggle("on",ck.checked),0);return;}
});
/* ---------- yönlendirme ---------- */
function owRoute(parts){
  const app=$("#app");
  if(parts[0]==="invite"){ app.innerHTML=owInvitePage(parts[1]); owBind(); return true; }
  if(parts[0]!=="owner") return false;
  if(!owIsOwner()){ app.innerHTML=owLoginPage(S.user?"Bu panele yalnızca işletme sahibi girebilir.":""); owBind(); return true; }
  const page=parts[1]||"home";
  const map={home:owHome,orders:owOrders,payments:owPayments,invoices:owInvoices,returns:owReturns,
    customers:owCustomers,products:owProducts,stock:owStock,accounting:owAccounting,
    users:owUsers,settings:owSettings,languages:owLanguages};
  app.innerHTML=(map[page]||owHome)();
  owBind(); return true;
}
</script>

<script>
/* ================================================================
   MODALS: media picker, restock, category, brand, user, menu item
   ================================================================ */
function libPicker(path){
  const m=DB.d.media;
  openModal(`<div class="modal w"><div class="mh"><h3>${t("mediaLib")}</h3>
    <button class="x" data-close>${I("x")}</button></div>

function restockModal(id){
  const p=prod(id); if(!p) return;

    <button type="button" class="x" data-close>${I("x")}</button></div>
    <div class="mb"><div class="rf" style="margin-bottom:16px">
      <span class="mth" style="width:54px;height:54px">${slot(p.images[0],{ratio:"",cls:"light",label:"",code:""})}</span>
      <span><b>${esc(L(p.name))}</b><br><span class="mono" style="color:var(--steel-500)">${esc(p.sku)}</span></span></div>
      <div class="srow"><span>${t("boStock")}</span><b>${p.stock}</b></div>
      <div class="srow"><span>${t("threshold")}</span><b>${p.threshold}</b></div>
      <div class="f" style="margin-top:14px"><label>+ ${t("qty")}</label><input type="number" name="qty" value="10" min="1"></div>
      <div class="f"><label>${t("threshold")}</label><input type="number" name="threshold" value="${p.threshold}" min="0"></div></div>
    <div class="mf"><button type="button" class="btn btn-line btn-sm" data-close>${t("cancel")}</button>
      <button class="btn btn-primary btn-sm" type="submit">${t("save")}</button></div></form></div>`);

    DB.log(S.user&&S.user.name,"stock",p.sku+" +"+f.qty); DB.save(); closeModal(); toast(t("saved")); render();});

function simpleForm(title,rows,onSave){
  openModal(`<div class="modal"><form id="sform"><div class="mh"><h3>${esc(title)}</h3>
    <button type="button" class="x" data-close>${I("x")}</button></div>
    <div class="mb">${rows.map(r=>r.type==="i18n"
      ? `<div class="f"><label>${esc(r.label)}</label>${LANGS.map(l=>
          `<input name="${r.name}_${l}" placeholder="${l.toUpperCase()}" value="${esc((r.value||{})[l]||"")}" style="margin-bottom:7px">`).join("")}</div>`
      : `<div class="f"><label>${esc(r.label)}</label><input name="${r.name}" value="${esc(r.value||"")}"></div>`).join("")}</div>
    <div class="mf"><button type="button" class="btn btn-line btn-sm" data-close>${t("cancel")}</button>
      <button class="btn btn-primary btn-sm" type="submit">${t("save")}</button></div></form></div>`);
  $("#sform").addEventListener("submit",e=>{e.preventDefault();
    onSave(Object.fromEntries(new FormData(e.target).entries())); });
}
const i18nFrom=(f,key)=>{const o={};LANGS.forEach(l=>o[l]=f[key+"_"+l]||"");
  LANGS.forEach(l=>{if(!o[l])o[l]=o.en||o.sv||o.tr||"";});return o;};

/* ================================================================
   ROUTER
   ================================================================ */
const ROLE_OF={admin:"admin",accounting:"accountant",super:"super"};
function boPage(role,page){
  if(!canAccess(role,page)) page=MODULES[role][0][1][0][0];
  switch(page){
    case "dashboard": return role==="accountant"?accDashboard(role):boDashboard(role);
    case "orders": return boOrders(role);
    case "quotes": return boQuotes(role);
    case "customers": return boCustomers(role);
    case "products": return boProducts(role);
    case "stock": return boStock(role);
    case "categories": return boCategoriesPage(role);
    case "brands": return boBrandsPage(role);
    case "content": return boContent(role);
    case "media": return boMedia(role);
    case "menu": return boMenu(role);
    case "invoices": return boInvoices(role);
    case "vat": return boVat(role);
    case "revenue": return boRevenue(role);
    case "users": return boUsers();
    case "audit": return boAudit();
    case "settings": return boSettings();
    default: return boDashboard(role);
  }
}
function parseHash(){
  const h=(location.hash||"#/").replace(/^#/,"");
  const [path,qs]=h.split("?");
  const parts=path.split("/").filter(Boolean), q={};
  (qs||"").split("&").filter(Boolean).forEach(kv=>{const[a,b]=kv.split("=");q[decodeURIComponent(a)]=decodeURIComponent(b||"");});
  return {parts,q};
}
function seoUpdate(){
  const B="Piro Gastro", r=S.route||{}, n=r.name;
  let title=B+" — Professional Kitchen Solutions", desc="";
  try{
    if(n==="p"){ const x=prod(r.parts[1]);
      if(x){ title=L(x.name)+" | "+B; desc=(L(x.desc)||"").slice(0,155); } }
    else if(n==="c"){ const c=cat(r.parts[1]);
      if(c){ title=L(c.name)+" | "+B; desc=(L(c.desc)||"").slice(0,155); } }
    else if(n==="products") title=t("productsNav")+" | "+B;
    else if(n==="brands") title=t("boBrands")+" | "+B;
    else if(n==="cart") title=t("cartTitle")+" | "+B;
  }catch(e){}
  document.title=title;
  let m=document.querySelector('meta[name="description"]');
  if(!m){ m=document.createElement("meta"); m.setAttribute("name","description"); document.head.appendChild(m); }
  if(desc) m.setAttribute("content",desc);
}
function render(){
  const {parts,q}=parseHash();
  const name=parts[0]||"home";
  S.route={name,parts,q};
  document.documentElement.lang=S.lang;
  /* SÜPER ADMIN paneli ve davet linki — mevcut akisin disinda */
  if((name==="owner"||name==="invite") && typeof owRoute==="function"){
    document.body.classList.toggle("editmode",name==="owner"&&canEditMedia());
    if(owRoute(parts)) return;
  }
  document.body.classList.toggle("editmode",canEditMedia());
  const app=$("#app");

  if(ROLE_OF[name]){
    const role=ROLE_OF[name];
    if(!S.user){ app.innerHTML=pageLogin(); bind(); return; }
    if(S.user.role!==role && S.user.role!=="super"){
      app.innerHTML=`<div class="wrap" style="padding:80px 0"><div class="empty">${I("lock")}<h3>403</h3>
        <p>${t("accNotice")}</p><a class="btn btn-primary" href="${HOME_FOR[S.user.role]}" style="margin-top:16px">
        ${t("boDashboard")}</a></div></div>`; bind(); return;
    }
    app.innerHTML=boPage(role,parts[1]||"dashboard"); bind(); return;
  }
  let body="";
  switch(name){
    case "home": body=pageHome(); break;
    case "products": S.filters.q=q.q!=null?q.q:S.filters.q; body=pageProducts(q); break;
    case "c": S.filters.cats=[parts[1]]; S.filters.brands=[]; body=pageProducts({}); break;
    case "p": body=pageProduct(parts[1]); break;
    case "brands": body=pageBrands(); break;
    case "about": body=pageAbout(); break;
    case "contact": body=pageContact(); break;
    case "legal": body=pageLegal(); break;
    case "cart": body=pageCart(); break;
    case "checkout": body=pageCheckout(); break;
    case "order": body=pageOrderDone(parts[1]); break;
    case "invoice": body=pageInvoice(parts[1]); break;
    case "account": body=pageAccount(); break;
    case "login":
      if(S.user){ go(HOME_FOR[S.user.role]); return; }
      app.innerHTML=pageLogin(); bind(); return;
    default: body=`<div class="wrap"><div class="empty" style="padding:110px 0">${I("search")}<h3>404</h3>
      <a class="btn btn-primary" href="#/" style="margin-top:14px">${t("backToShop")}</a></div></div>`;
  }
  app.innerHTML=topbarHTML()+navHTML()+`<main>${body}</main>`+footerHTML();
  bind(); seoUpdate();
}
window.addEventListener("hashchange",()=>{ S.gal=0; S.showAll=false; render(); window.scrollTo({top:0,behavior:"instant"}); });

/* ================================================================
   EVENT BINDING
   ================================================================ */
const debounce=(fn,ms)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};};
function keepFocus(sel){setTimeout(()=>{const x=$(sel);if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},0);}
function bind(){
  const nb=$("#navbar");
  if(nb){const f=()=>nb.classList.toggle("stuck",window.scrollY>8);f();window.onscroll=f;}
  const sf=$("#searchform");
  if(sf) sf.addEventListener("submit",e=>{e.preventDefault();
    S.filters.q=new FormData(sf).get("q")||""; S.filters.cats=[]; S.filters.brands=[];
    if(S.route.name==="products"){history.replaceState(null,"","#/products");render();} else go("#/products");});
  const cb=$("#catbtn"),mg=$("#mega");
  if(cb&&mg){ cb.onclick=e=>{e.stopPropagation();mg.classList.toggle("on");};
    document.addEventListener("click",()=>mg.classList.remove("on"),{once:true}); }
  const ft=$("#ftoggle"); if(ft) ft.onclick=()=>{S.fopen=!S.fopen;$(".side-f").classList.toggle("collapsed",!S.fopen);};
  $$("[data-fc]").forEach(el=>el.addEventListener("change",()=>{const id=el.dataset.fc,f=S.filters;
    f.cats=el.checked?[...new Set([...f.cats,id])]:f.cats.filter(x=>x!==id);
    history.replaceState(null,"","#/products");render();}));
  $$("[data-fb]").forEach(el=>el.addEventListener("change",()=>{const id=el.dataset.fb,f=S.filters;
    f.brands=el.checked?[...new Set([...f.brands,id])]:f.brands.filter(x=>x!==id);
    history.replaceState(null,"","#/products");render();}));
  const sa=$("[data-showall]"); if(sa) sa.onclick=()=>{S.showAll=true;S.page=1;render();};
  $$("[data-page]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.page||1;render();
    const g=$(".pgrid"); if(g) window.scrollTo({top:g.getBoundingClientRect().top+window.scrollY-140,behavior:"instant"});});
  const fs=$("#fstock"); if(fs) fs.onchange=()=>{S.filters.stock=fs.checked;render();};
  const fso=$("#fsort"); if(fso) fso.onchange=()=>{S.filters.sort=fso.value;render();};
  const fc=$("#fclear"); if(fc) fc.onclick=()=>{S.filters={cats:[],brands:[],stock:false,sort:"featured",q:""};
    history.replaceState(null,"","#/products");render();};
  const qv=$("#qv");
  if(qv){ $("#qm").onclick=()=>qv.value=Math.max(1,(+qv.value||1)-1);
    $("#qp").onclick=()=>qv.value=Math.min(999,(+qv.value||1)+1);
    const ab=$("#addbtn"); if(ab) ab.onclick=()=>addToCart(S.route.parts[1],+qv.value||1); }
  $$("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  $$("[data-gal]").forEach(b=>b.onclick=()=>{S.gal=+b.dataset.gal;render();});
  $$("[data-q]").forEach(b=>b.onclick=()=>{const l=S.cart.find(x=>x.id===b.dataset.id);
    if(l) setQty(b.dataset.id,l.qty+(b.dataset.q==="+"?1:-1));});
  $$("[data-qi]").forEach(i=>i.onchange=()=>setQty(i.dataset.qi,+i.value||1));
  const cof=$("#coform");
  if(cof){ $$("[data-carrier]").forEach(el=>el.onclick=()=>{CO.carrier=el.dataset.carrier;render();});
    $$("[data-payment]").forEach(el=>el.onclick=()=>{CO.payment=el.dataset.payment;render();});
    cof.addEventListener("submit",e=>{e.preventDefault();
      const f=Object.fromEntries(new FormData(cof).entries());
      if(!f.company||!f.email||!f.addr){toast(t("required"),"err");return;}
      placeOrder(f);}); }
  const ctf=$("#contactform");
  if(ctf) ctf.addEventListener("submit",e=>{e.preventDefault();
    const f=Object.fromEntries(new FormData(ctf).entries());
    DB.d.quotes.unshift({id:"Q-"+pad(2400+DB.d.quotes.length,4),date:new Date().toISOString(),
      name:f.name,company:f.company||f.name,email:f.email,phone:f.phone||"",productId:"",qty:1,
      msg:"["+(f.subject||"-")+"] "+f.msg,status:"open"});
    DB.save(); ctf.reset(); toast(t("contactOk"));});
  const nf=$("#newsform"); if(nf) nf.addEventListener("submit",e=>{e.preventDefault();nf.reset();toast(t("subscribed"));});
  const lf=$("#loginform");
  if(lf) lf.addEventListener("submit",e=>{e.preventDefault();
    const f=Object.fromEntries(new FormData(lf).entries());
    const u=authenticate(f.email,f.pass);
    if(!u){toast(t("badCred"),"err");return;}
    S.user=u; saveUser(); toast(t("welcome")+", "+u.name); go(HOME_FOR[u.role]); render();});
  /* back office */
  $$("[data-per]").forEach(b=>b.onclick=()=>{S.period=b.dataset.per;render();});
  const oq=$("#oq"); if(oq) oq.oninput=debounce(()=>{of_.q=oq.value;render();keepFocus("#oq");},350);
  const ost=$("#ost"); if(ost) ost.onchange=()=>{of_.status=ost.value;render();};
  const pq=$("#pq"); if(pq) pq.oninput=debounce(()=>{pf.q=pq.value;render();keepFocus("#pq");},350);
  const pc=$("#pcat"); if(pc) pc.onchange=()=>{pf.cat=pc.value;render();};
  const iq=$("#iq"); if(iq) iq.oninput=debounce(()=>{if_.q=iq.value;render();keepFocus("#iq");},350);
  const ip=$("#ipaid"); if(ip) ip.onchange=()=>{if_.paid=ip.value;render();};
  $$("[data-setstatus]").forEach(s=>s.onchange=()=>{
    const o=DB.d.orders.find(x=>x.id===s.dataset.setstatus); if(!o)return;
    o.status=s.value;
    const iv=DB.d.invoices.find(i=>i.orderId===o.id);
    if(iv&&(o.status==="delivered"||o.status==="shipped")) iv.paid=true;
    DB.log(S.user&&S.user.name,"order.status",o.id+" → "+s.value); DB.save(); toast(t("statusChanged")); render();});
  $$("[data-setrole]").forEach(s=>s.onchange=()=>{
    const u=DB.d.users.find(x=>x.id===s.dataset.setrole); if(!u)return;
    u.role=s.value; DB.log(S.user&&S.user.name,"user.role",u.email+" → "+s.value); DB.save(); toast(t("saved")); render();});

  const ma=$("#mediaadd"); if(ma) ma.onclick=()=>pickImageFor("media.__new","");
  const dz=$("#dropzone");
  if(dz){ dz.onclick=()=>pickImageFor("media.__new","");
    dz.ondragover=e=>{e.preventDefault();dz.classList.add("over");};
    dz.ondragleave=()=>dz.classList.remove("over");
    dz.ondrop=async e=>{e.preventDefault();dz.classList.remove("over");
      const f=e.dataTransfer.files[0]; if(!f)return;
      const url=await fileToDataUrl(f,1800,.82);
      DB.d.media.unshift({id:uid("M"),name:f.name,src:url,added:new Date().toISOString()});
      DB.save(); toast(t("saved")); render();}; }
  const au=$("#adduser");
  if(au) au.onclick=()=>simpleForm(t("addUser"),
    [{name:"name",label:t("name"),value:""},{name:"email",label:t("email"),value:""},
     {name:"pass",label:t("password"),value:"pgc-2026"},{name:"role",label:t("role"),value:"admin"}],f=>{
      DB.d.users.push({id:"U-"+pad(DB.d.users.length+1,3),name:f.name,email:f.email,pass:f.pass,
        role:["admin","accountant","super","customer"].includes(f.role)?f.role:"admin",
        active:true,last:new Date().toISOString()});
      DB.log(S.user&&S.user.name,"user.create",f.email); DB.save(); closeModal(); toast(t("saved")); render();});
  const ca=$("#catadd");
  if(ca) ca.onclick=()=>simpleForm(t("boCategories"),
    [{name:"name",label:t("name"),type:"i18n",value:{}},{name:"desc",label:t("bodyText"),type:"i18n",value:{}}],f=>{
      const nm=i18nFrom(f,"name"), id=slug(nm.en||nm.sv||nm.tr)||uid("c").toLowerCase();
      DB.d.categories.push({id,icon:"box",name:nm,desc:i18nFrom(f,"desc"),
        image:"assets/cat-"+id+".jpg",order:DB.d.categories.length,visible:true});
      DB.log(S.user&&S.user.name,"category.create",id); DB.save(); closeModal(); toast(t("saved")); render();});
  const ba=$("#brandadd");
  if(ba) ba.onclick=()=>simpleForm(t("boBrands"),
    [{name:"bname",label:t("name"),value:""},{name:"country",label:t("country"),value:"SE"},
     {name:"desc",label:t("bodyText"),type:"i18n",value:{}}],f=>{
      const id=slug(f.bname)||uid("b").toLowerCase();
      DB.d.brands.push({id,name:f.bname,country:(f.country||"SE").toUpperCase(),
        desc:i18nFrom(f,"desc"),image:"assets/brand-"+id+".jpg"});
      DB.log(S.user&&S.user.name,"brand.create",id); DB.save(); closeModal(); toast(t("saved")); render();});
  const mna=$("#menuadd");
  if(mna) mna.onclick=()=>simpleForm(t("boMenu"),
    [{name:"label",label:t("label"),type:"i18n",value:{}},{name:"href",label:t("link"),value:"#/products"}],f=>{
      C().menu.push({id:uid("m"),label:i18nFrom(f,"label"),href:f.href||"#/",nav:true});
      DB.save(); closeModal(); toast(t("saved")); render();});
  const es=$("#editsettings");
  if(es) es.onclick=()=>fieldEditor(t("boSettings"),
    ["brand","legal","reg","vat","addr","zip","city","country","phone","email","iban","bank","trAddr","trCity","trPhone"]
      .map(k=>({path:"settings."+k,label:k,type:"text"})));
  const eh=$("[data-edithero]");
  if(eh) eh.onclick=()=>fieldEditor(t("hero"),[
    {path:"content.hero.image",label:t("hero")+" — "+t("uploadImage"),type:"image"},
    {path:"content.hero.kicker",label:t("subheading"),type:"i18n"},
    {path:"content.hero.title",label:t("heading"),type:"i18n"},
    {path:"content.hero.titleGold",label:t("heading")+" (gold)",type:"i18n"},
    {path:"content.hero.lead",label:t("bodyText"),type:"i18n",multiline:true},
    {path:"content.hero.btn1.label",label:t("buttonLabel"),type:"i18n"},
    {path:"content.hero.btn1.href",label:t("buttonLink"),type:"text"}]);
  const eab=$("[data-editabout]");
  if(eab) eab.onclick=()=>fieldEditor("About",[
    {path:"content.about.image",label:t("uploadImage"),type:"image"},
    {path:"content.about.kicker",label:t("subheading"),type:"i18n"},
    {path:"content.about.title",label:t("heading"),type:"i18n"},
    {path:"content.about.lead",label:t("bodyText"),type:"i18n",multiline:true},
    {path:"content.about.body",label:t("bodyText")+" 2",type:"i18n",multiline:true}]);
  const ect=$("[data-editcontact]");
  if(ect) ect.onclick=()=>fieldEditor("Contact",[
    {path:"content.contact.image",label:t("uploadImage"),type:"image"},
    {path:"content.contact.title",label:t("heading"),type:"i18n"},
    {path:"content.contact.lead",label:t("bodyText"),type:"i18n",multiline:true},
    {path:"content.contact.hours",label:t("bodyText")+" 2",type:"i18n"}]);
  const rdb=$("#resetdb");
  if(rdb) rdb.onclick=()=>{if(confirm(t("confirmDel"))){DB.reset();toast(t("saved"));render();}};
  const ab2=$("#asideburger"); if(ab2) ab2.onclick=()=>{$("#aside").classList.toggle("on");$("#scrim").classList.toggle("on");};
  const bg=$("#burger"); if(bg) bg.onclick=mobileMenu;
  const lo=$("#logout"); if(lo) lo.onclick=()=>{DB.log(S.user&&S.user.name,"logout","");S.user=null;saveUser();go("#/");render();};
}

const closeDrawer=()=>{$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");};
$("#scrim").addEventListener("click",()=>{closeDrawer();const a=$("#aside");if(a)a.classList.remove("on");});

/* ---------- delegated clicks ---------- */
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);
  const el=q("[data-lang]"); if(el){setLang(el.dataset.lang);closeDrawer();return;}
  if(q("[data-close]")){closeModal();return;}
  const cl=q("[data-cmslang]");
  if(cl){ S.cmsLang=cl.dataset.cmslang;

/* ================================================================
   ARAYÜZ 2.0 — geniş başlık, akıllı arama, çok sütunlu mega menü
   Mevcut fonksiyonlar override edilir; veri katmanı, ödeme, sipariş,
   paneller ve dil altyapısı olduğu gibi kalır.
   ================================================================ */

/* ---------- ÇOKLU DİL: yönetici panelinden yeni dil ---------- */
function langsSetup(){
  if(!DB.d.langs) DB.d.langs=[];
  DB.d.langs.forEach(function(l){
    if(UI[l.code]) return;
    const base=UI[l.base]||UI.en;
    UI[l.code]=Object.assign({},base,{
      _locale:l.locale||base._locale,_cur:l.currency||base._cur,
      _rate:+l.rate||base._rate,_vat:(l.vat!=null?+l.vat:base._vat),_name:l.name
    });
    if(l.strings) Object.assign(UI[l.code],l.strings);
    if(LANGS.indexOf(l.code)<0) LANGS.push(l.code);
  });
}
function addLanguage(o){
  if(!o.code||UI[o.code]) return false;
  DB.d.langs=DB.d.langs||[];
  DB.d.langs.push({code:o.code,name:o.name||o.code.toUpperCase(),base:o.base||"en",
    locale:o.locale||"en-GB",currency:o.currency||"EUR",rate:+o.rate||1,vat:+o.vat||0.21,strings:{}});
  DB.save(); langsSetup(); return true;
}
function removeLanguage(code){
  if(["sv","en","tr"].indexOf(code)>=0) return false;
  DB.d.langs=(DB.d.langs||[]).filter(function(l){return l.code!==code;});
  const i=LANGS.indexOf(code); if(i>=0) LANGS.splice(i,1);
  delete UI[code];
  if(S.lang===code) setLang("tr");
  DB.save(); return true;
}
const langName=c=>(UI[c]&&UI[c]._name)||c.toUpperCase();

/* ---------- ÜST İNCE ŞERİT ---------- */
function topbarHTML(){
  const tb=C().topbar||[];
  return `<div class="topstrip"><div class="wrap">
    <span class="ts-msg">${I("truck")}${esc(L(L3(
      "Fri frakt på order över 25 000 kr","Free freight on orders above €2,500",
      "2.500 € üzeri siparişlerde ücretsiz kargo")))}</span>
    <div class="ts-right">
      ${tb.map(x=>`<span class="ts-i">${I(x.icon)}${esc(L(x.title))}</span>`).join("")}
      <div class="lang">${LANGS.map(l=>`<button data-lang="${l}" class="${S.lang===l?"on":""}"
        title="${esc(langName(l))}">${l.toUpperCase()}</button>`).join("")}</div>
    </div></div></div>`;
}

/* ---------- ANA BAŞLIK + ÇOK SÜTUNLU KATEGORİ BARI ---------- */
function navHTML(){

  const scope=S.searchScope||"";
  return `<header class="mainhead" id="mainhead"><div class="wrap mh-in">
    <a class="mh-logo" href="#/" aria-label="Piro Gastro">
      ${logoMark(46,true)}
      <span class="mh-name"><b>Piro Gastro</b><small lang="en">Professional Kitchen Solutions</small></span>
    </a>
    <form class="mh-search" id="smartsearch" autocomplete="off">
      <select class="ms-scope" id="msscope">
        <option value="">${esc(t("all"))}</option>
        ${mains.map(c=>`<option value="${c.id}" ${scope===c.id?"selected":""}>${esc(L(c.name))}</option>`).join("")}
      </select>
      <input class="ms-input" id="msinput" type="search" name="q" value="${esc(S.filters.q||"")}"
        placeholder="${esc(L(L3("Sök produkt, varumärke eller modellnummer…",
          "Search product, brand or model number…","Ürün, marka veya model numarası ara…")))}">

              <em>${prods().filter(p=>!p.hidden&&p.sub===k.id).length}</em></a>`).join("")}</div>

    </div></div></nav>`;

/* ---------- AKILLI ARAMA ---------- */
function searchProducts(q,scope,limit){
  q=String(q||"").trim().toLowerCase(); if(q.length<2) return [];
  const words=q.split(/\s+/).filter(Boolean);
  const out=[];
  const list=prods();
  for(let i=0;i<list.length;i++){
    const p=list[i]; if(p.hidden) continue;
    if(scope&&!inCat(p,scope)&&!subCats(scope).some(k=>k.id===p.sub)) continue;
    const b=brand(p.brand), tech=p.tech||{};
    const cM=cat(p.cat), cS=p.sub?cat(p.sub):null;
    const hay=(L(p.name)+" "+p.sku+" "+(b?b.name:"")+" "+(tech.model||"")+" "+(tech.manufacturer||"")
      +" "+(cM?L(cM.name):"")+" "+(cS?L(cS.name):"")).toLowerCase();
    if(!words.every(w=>hay.indexOf(w)>=0)) continue;
    let score=0;
    if(p.sku.toLowerCase()===q||(tech.model||"").toLowerCase()===q) score+=100;
    else if(p.sku.toLowerCase().indexOf(q)===0) score+=60;
    if(L(p.name).toLowerCase().indexOf(q)===0) score+=40;
    else if(L(p.name).toLowerCase().indexOf(q)>=0) score+=20;
    if(b&&b.name.toLowerCase().indexOf(q)>=0) score+=15;
    if(p.stock>0) score+=5;
    out.push({p,score});
    if(out.length>400) break;
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,limit||8).map(x=>x.p);
}
function renderSuggest(){
  const box=$("#mssug"), inp=$("#msinput"); if(!box||!inp) return;
  const q=inp.value.trim();
  if(q.length<2){ box.classList.remove("on"); box.innerHTML=""; return; }
  const scope=($("#msscope")||{}).value||"";
  const hits=searchProducts(q,scope,8);
  if(!hits.length){
    box.innerHTML=`<div class="ms-empty">${esc(t("noResults"))}</div>`;
    box.classList.add("on"); return;
  }
  const total=searchProducts(q,scope,400).length;
  box.innerHTML=hits.map(p=>{
    const b=brand(p.brand);
    return `<a class="ms-row" href="#/p/${p.id}" data-sug>
      <span class="ms-th">${slot((p.images||[])[0],{ratio:"",cls:"light",label:"",code:""})}</span>
      <span class="ms-tx"><b>${esc(L(p.name))}</b>
        <small>${esc(b?b.name:"")} · ${esc(p.sku)}</small></span>
      <span class="ms-pr">${money(netPrice(p))}</span></a>`;
  }).join("")+`<a class="ms-all" href="#/products?q=${encodeURIComponent(q)}" data-sug>
      ${esc(L(L3("Visa alla träffar","Show all results","Tüm sonuçları gör")))} (${total})${I("arrow")}</a>`;
  box.classList.add("on");
}
const debSuggest=(function(){let h;return function(){clearTimeout(h);h=setTimeout(renderSuggest,180);};})();
document.addEventListener("input",function(e){ if(e.target.id==="msinput") debSuggest(); });
document.addEventListener("change",function(e){ if(e.target.id==="msscope"){ S.searchScope=e.target.value; renderSuggest(); } });
document.addEventListener("submit",function(e){
  if(e.target.id!=="smartsearch") return;
  e.preventDefault();
  const q=($("#msinput")||{}).value||"";
  S.filters.q=q.trim(); S.filters.brands=[];
  const sc=($("#msscope")||{}).value||"";
  S.filters.cats=sc?[sc]:[];
  const box=$("#mssug"); if(box){box.classList.remove("on");box.innerHTML="";}
  if(S.route.name==="products"){ history.replaceState(null,"","#/products"); render(); }
  else go("#/products");
});
document.addEventListener("click",function(e){
  if(e.target.closest("[data-sug]")){ const b=$("#mssug"); if(b){b.classList.remove("on");b.innerHTML="";} return; }
  if(!e.target.closest("#smartsearch")){ const b=$("#mssug"); if(b) b.classList.remove("on"); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ const b=$("#mssug"); if(b) b.classList.remove("on"); }
});
</script>

<script>
/* ================================================================
   RESMİ FATURA — PDF ÜRETİCİSİ
   Harici kütüphane yok. Standart Type1 (Helvetica) + WinAnsi
   kodlaması; Türkçe ş/Ş/ğ/Ğ/ı/İ harfleri /Differences ile doğru
   glif adlarına bağlanır, böylece sadeleştirmeye gerek kalmaz.
   ================================================================ */
const PGP_DIFF={"ş":1,"Ş":2,"ğ":3,"Ğ":4,"ı":5,"İ":6};
const PGP_GLYPH=["scedilla","Scedilla","gbreve","Gbreve","dotlessi","Idotaccent"];
/* Helvetica genişlikleri (1/1000 em) */
const PGP_W=(function(){
  const w={},a=[32,278,33,278,34,355,35,556,36,556,37,889,38,667,39,191,40,333,41,333,42,389,43,584,
   44,278,45,333,46,278,47,278,58,278,59,278,60,584,61,584,62,584,63,556,64,1015,
   65,667,66,667,67,722,68,722,69,667,70,611,71,778,72,722,73,278,74,500,75,667,76,556,77,833,
   78,722,79,778,80,667,81,778,82,722,83,667,84,611,85,722,86,667,87,944,88,667,89,667,90,611,
   91,278,92,278,93,278,94,469,95,556,96,333,
   97,556,98,556,99,500,100,556,101,556,102,278,103,556,104,556,105,222,106,222,107,500,108,222,
   109,833,110,556,111,556,112,556,113,556,114,333,115,500,116,278,117,556,118,500,119,722,120,500,
   121,500,122,500,123,334,124,260,125,334,126,584];
  for(let i=0;i<a.length;i+=2) w[a[i]]=a[i+1];
  for(let i=48;i<=57;i++) w[i]=556;                 /* rakamlar */
  [0xE5,0xE4,0xF6,0xFC,0xE7,0xE9,0xE8].forEach(c=>w[c]=556);
  [0xC5,0xC4,0xD6,0xDC,0xC7].forEach(c=>w[c]=722);
  w[1]=500;w[2]=667;w[3]=556;w[4]=778;w[5]=222;w[6]=278;   /* ş Ş ğ Ğ ı İ */
  w[0x80]=556;

})();
/* WinAnsi'de karşılığı olmayan çok baytlı simgeler önce metne çevrilir */
const PGP_PRE=[[/₺/g,"TL "],[/₹/g,"INR "],[/₽/g,"RUB "],
  [/İ/g,"İ"],[/…/g,"..."],[/ | | /g," "]];
function pgpEnc(s){
  s=String(s==null?"":s);
  PGP_PRE.forEach(r=>{s=s.replace(r[0],r[1]);});
  let out="";
  for(const ch of s){
    let code=PGP_DIFF[ch];
    if(!code){
      const cc=ch.codePointAt(0);
      if(cc===0x20AC) code=0x80;
      else if(cc===0xA0||cc===0x202F||cc===0x2009) code=32;
      else if(cc===0x2013) code=0x96; else if(cc===0x2014) code=0x97;
      else if(cc===0x2018) code=0x91; else if(cc===0x2019) code=0x92;
      else if(cc===0x201C) code=0x93; else if(cc===0x201D) code=0x94;
      else if(cc<256) code=cc; else code=63;
    }
    if(code===40||code===41||code===92) out+="\\"+String.fromCharCode(code);
    else if(code<32) out+="\\"+("00"+code.toString(8)).slice(-3);
    else out+=String.fromCharCode(code);
  }
  return out;
}
function pgpW(s,size){
  s=String(s==null?"":s);
  PGP_PRE.forEach(r=>{s=s.replace(r[0],r[1]);});
  let w=0;
  for(const ch of String(s==null?"":s)){
    let code=PGP_DIFF[ch];
    if(!code){const cc=ch.codePointAt(0); code=cc<256?cc:63;}
    w+=(PGP_W[code]!==undefined?PGP_W[code]:556);
  }
  return w*size/1000;
}
function pgpFit(s,size,max){
  s=String(s==null?"":s);
  if(pgpW(s,size)<=max) return s;
  let r=s;
  while(r.length>1&&pgpW(r+"…",size)>max) r=r.slice(0,-1);
  return r+"…";
}
/* --- sayfa çizim yüzeyi --- */
function pgpPage(){
  const ops=[];
  const api={
    ops,
    text(x,y,s,o){o=o||{};
      const sz=o.size||9.6, f=o.bold?"/F2":"/F1";
      let xx=x;
      if(o.align==="right") xx=x-pgpW(s,sz);
      else if(o.align==="center") xx=x-pgpW(s,sz)/2;
      const c=o.color||[0.16,0.20,0.25];
      ops.push(`BT ${c[0]} ${c[1]} ${c[2]} rg ${f} ${sz} Tf 1 0 0 1 ${xx.toFixed(2)} ${y.toFixed(2)} Tm (${pgpEnc(s)}) Tj ET`);
      return api;},
    line(x1,y1,x2,y2,o){o=o||{};
      const c=o.color||[0.84,0.88,0.92];
      ops.push(`${c[0]} ${c[1]} ${c[2]} RG ${(o.w||0.7)} w ${x1} ${y1} m ${x2} ${y2} l S`);
      return api;},
    rect(x,y,w,h,c){ops.push(`${c[0]} ${c[1]} ${c[2]} rg ${x} ${y} ${w} ${h} re f`);return api;}
  };
  return api;
}
function pgpBuild(pages){
  const objs=[]; const add=s=>{objs.push(s);return objs.length;};
  const nPage=pages.length;
  const catalog=1, pagesObj=2, fontR=3, fontB=4, enc=5;
  objs.length=0;
  objs[0]=`<</Type/Catalog/Pages 2 0 R>>`;
  objs[1]="";                                        /* sonra doldurulur */
  objs[2]=`<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding 5 0 R>>`;
  objs[3]=`<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding 5 0 R>>`;
  objs[4]=`<</Type/Encoding/BaseEncoding/WinAnsiEncoding/Differences[1${PGP_GLYPH.map(g=>"/"+g).join("")}]>>`;
  const kids=[];
  pages.forEach(p=>{
    const stream=p.ops.join("\n");
    const cIdx=add(`<</Length ${stream.length}>>\nstream\n${stream}\nendstream`);
    const pIdx=add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${cIdx} 0 R>>`);
    kids.push(pIdx+" 0 R");
  });
  objs[1]=`<</Type/Pages/Kids[${kids.join(" ")}]/Count ${nPage}>>`;

  objs.forEach((o,i)=>{ off[i]=out.length; out+=`${i+1} 0 obj\n${o}\nendobj\n`; });

  off.forEach(o=>{ out+=("0000000000"+o).slice(-10)+" 00000 n \n"; });
  out+=`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  const buf=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++) buf[i]=out.charCodeAt(i)&0xFF;
  return buf;
}

  [[T.sub,money2(inv.net)],[T.vat+" ("+Math.round(inv.vatRate*100)+"%)",money2(inv.vat)]]
    .forEach(r=>{P.text(lx,y,r[0],{size:8.8,color:PGP_GREY});
      P.text(tx,y,r[1],{size:8.8,align:"right",color:PGP_INK}); y-=14;});
  P.rect(lx-12,y-6,R-lx+12,24,[0.039,0.106,0.180]);
  P.text(lx,y+4,T.total,{size:9,bold:true,color:[1,1,1]});
  P.text(tx,y+4,totTxt,{size:tSize,bold:true,align:"right",color:[1,1,1]});
  y-=34;
  /* ödeme bilgileri */
  P.line(M,y,R,y); y-=15;
  P.text(M,y,T.payMethod+": ",{size:8.6,color:PGP_GREY});
  P.text(M+pgpW(T.payMethod+": ",8.6),y,payLabel,{size:8.6,bold:true,color:PGP_INK}); y-=12;
  P.text(M,y,T.terms+": "+T.net30+" · IBAN "+st.iban+" · "+st.bank,{size:8.2,color:PGP_GREY}); y-=12;
  P.text(M,y,st.legal+" · Org.nr "+st.reg+" · VAT "+st.vat,{size:8.2,color:PGP_GREY});
  /* alt bilgi — toplam sayfa sayısı belli olduktan sonra her sayfaya */
  pages.forEach((pg,i)=>{
    pg.line(M,52,R,52);
    pg.text(M,42,st.legal+" · "+st.addr+" · "+st.zip+" "+st.city+" · "+st.country,{size:7.4,color:PGP_GREY});
    pg.text(R,42,T.page+" "+(i+1)+" "+T.of+" "+pages.length,{size:7.4,align:"right",color:PGP_GREY});
  });
  return pages;
}
function invoicePDFBlob(inv){
  return new Blob([pgpBuild(pgpInvoicePages(inv))],{type:"application/pdf"});
}
function invoicePDFName(inv){
  return "Faktura-"+inv.id+".pdf";
}
function downloadInvoicePDF(invId){
  const inv=DB.d.invoices.find(x=>x.id===invId);
  if(!inv){ toast("Fatura bulunamadı"); return; }
  try{
    const url=URL.createObjectURL(invoicePDFBlob(inv));
    const a=document.createElement("a");
    a.href=url; a.download=invoicePDFName(inv);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    DB.log((S.user&&S.user.name)||"—","invoice.download",inv.id); DB.save();
    toast(L(L3("Faktura nedladdad","Invoice downloaded","Fatura indirildi"))+" · "+inv.id);
  }catch(e){ toast("PDF oluşturulamadı: "+e.message); }
}
/* --- faturayı tekrar gönder (yönetici) --- */
function invoiceResend(invId){
  const inv=DB.d.invoices.find(x=>x.id===invId); if(!inv) return;
  const o=DB.d.orders.find(x=>x.id===inv.orderId);
  const c=(o&&o.customer)||DB.d.customers.find(x=>x.id===inv.customerId)||{};
  const st=DB.d.settings;
  const konu=`${st.legal} — Fatura ${inv.id}`;
  const govde=`Sayın ${c.name||c.company||""},\n\n`+
    `${inv.orderId} numaralı siparişinize ait ${inv.id} numaralı faturanız ektedir.\n\n`+
    `Fatura no: ${inv.id}\nSipariş no: ${inv.orderId}\n`+
    `Fatura tarihi: ${fdate(inv.issued)}\nVade: ${fdate(inv.due)}\n`+
    `Ara toplam: ${money2(inv.net)}\nKDV: ${money2(inv.vat)}\nGenel toplam: ${money2(inv.total)}\n\n`+
    `${st.legal} · Org.nr ${st.reg} · VAT ${st.vat}`;
  openModal(`<div class="modal"><div class="mh"><h3>${I("mail")}Faturayı tekrar gönder</h3>
    <button type="button" class="x" data-close>${I("x")}</button></div>
    <div class="mb">
      <div class="srow"><span>Fatura</span><b class="mono">${esc(inv.id)}</b></div>
      <div class="srow"><span>Sipariş</span><b class="mono">${esc(inv.orderId)}</b></div>
      <div class="srow"><span>Alıcı</span><b>${esc(c.email||"—")}</b></div>
      <div class="srow tot"><span>Tutar</span><span>${money2(inv.total)}</span></div>
      <div class="note n-i" style="margin-top:16px">${I("info")}<span>Bu kurulum tek dosya olarak çalıştığı için
        e-posta sunucusu yok. Aşağıdaki düğme faturayı PDF olarak indirir ve varsayılan e-posta uygulamanızı
        hazır metinle açar; PDF'i ekleyip gönderirsiniz. İşlem denetim kaydına yazılır.</span></div>
    </div>
    <div class="mf"><button type="button" class="btn btn-line btn-sm" data-close>${t("cancel")}</button>
      <button type="button" class="btn btn-primary btn-sm" id="invresendgo">${I("mail")}PDF indir ve e-postayı aç</button>
    </div></div>`);
  const b=$("#invresendgo");
  if(b) b.onclick=()=>{
    downloadInvoicePDF(inv.id);
    inv.sent=new Date().toISOString();
    inv.sentCount=(inv.sentCount||0)+1;
    DB.log((S.user&&S.user.name)||"—","invoice.resend",inv.id+" → "+(c.email||"—"));
    DB.save(); closeModal();
    if(c.email) location.href="mailto:"+encodeURIComponent(c.email)+
      "?subject="+encodeURIComponent(konu)+"&body="+encodeURIComponent(govde);
    toast("Fatura yeniden gönderime hazırlandı");
  };
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-invpdf]");
  if(d){ e.preventDefault(); downloadInvoicePDF(d.dataset.invpdf); return; }
  const r=e.target.closest("[data-invsend]");
  if(r){ e.preventDefault(); invoiceResend(r.dataset.invsend); return; }
});
</script>

<script>
/* ================================================================
   YÖNETİCİ — KATEGORİ BAZLI ÜRÜN YÖNETİMİ
   Müşteri tarafındaki ana kategoriler, aynı isim ve aynı sırayla.
   ================================================================ */
/* mainCats() sistemde zaten tanımlı — yeniden tanımlanmaz */
function catProdList(catId){ return prods().filter(p=>p.cat===catId); }
function catCoverImg(c){
  if(c.image) return c.image;
  const p=catProdList(c.id).find(x=>(x.images||[])[0]);
  return p?p.images[0]:"";
}
function catLowCount(catId){
  return catProdList(catId).filter(p=>p.stock<=p.threshold).length;
}
/* ---------- Yönetici / Süper Yönetici paneli (#/admin, #/super) ---------- */
function boProducts(role){
  const q=(pf.q||"").trim();
  /* arama yapıldıysa kategoriden bağımsız düz sonuç */
  if(q&&!pf.cat) return boProdSearch(role,q);
  if(!pf.cat) return boProdCats(role);
  return boProdOne(role,pf.cat);
}
function boProdCats(role){
  const mc=mainCats(), total=prods().length;
  return shell(role,"products",t("boProducts"),`
    <div class="note n-i">${I("layers")}<span>${esc(L(L3(
      "Välj en kategori för att hantera produkterna i den.",
      "Choose a category to manage the products inside it.",
      "Ürünleri yönetmek için bir kategori seçin.")))}</span></div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="kl">${I("layers")}${t("boCategories")}</div><div class="kv">${mc.length}</div></div>
      <div class="kpi g"><div class="kl">${I("tag")}${t("boProducts")}</div><div class="kv">${total}</div></div>
      <div class="kpi w"><div class="kl">${I("alert")}${t("boStock")}</div><div class="kv">${lowStock().length}</div></div>
    </div>
    <div class="card"><div class="chead"><h3>${mc.length} ${t("boCategories")}</h3>
      <input class="sinp" id="pq" placeholder="${t("search")}" value="${esc(pf.q)}">
      <button class="btn btn-line btn-sm" data-csv="products">${I("down")}${t("export")}</button>
      <button class="btn btn-line btn-sm" data-bulk>${I("upload")}CSV içe aktar</button>
      <button class="btn btn-primary btn-sm" data-editp="new">${I("plus")}${t("add")}</button></div>
      <div class="pcatgrid">
        ${mc.map(c=>{const n=catProdList(c.id).length, low=catLowCount(c.id),
            subs=cats().filter(k=>k.parent===c.id).length;
          return `<button type="button" class="pcatc" data-pcat="${esc(c.id)}">
            <span class="im">${slot(catCoverImg(c),{ratio:"",cls:"light",label:L(c.name),code:""})}</span>
            <span class="bd"><b>${esc(L(c.name))}</b>
              <small>${n} ${esc(t("products"))}${subs?" · "+subs+" "+esc(t("boCategories")).toLowerCase():""}</small>
              <span class="mt">${low?`<span class="chip c-y">${low} ${esc(t("lowStock"))}</span>`
                :`<span class="chip c-g">${esc(t("inStock"))}</span>`}</span>
            </span></button>`;}).join("")}
      </div></div>`);
}
function boProdSearch(role,q){
  const s=q.toLowerCase();
  const list=prods().filter(p=>L(p.name).toLowerCase().includes(s)||p.sku.toLowerCase().includes(s));
  return shell(role,"products",t("boProducts"),`
    <div class="card"><div class="chead">
      <button class="btn btn-line btn-sm" data-pcat="">${I("arrow")}${t("boCategories")}</button>
      <h3>${list.length} ${t("boProducts")} — “${esc(q)}”</h3>
      <input class="sinp" id="pq" placeholder="${t("search")}" value="${esc(pf.q)}">
      <button class="btn btn-primary btn-sm" data-editp="new">${I("plus")}${t("add")}</button></div>
      ${boProdTable(list)}</div>`);
}
function boProdOne(role,catId){
  const c=cat(catId); if(!c){ pf.cat=""; return boProdCats(role); }
  const subs=cats().filter(k=>k.parent===catId);
  let list=catProdList(catId);
  if(pf.sub) list=list.filter(p=>p.sub===pf.sub);
  if(pf.q){const s=pf.q.toLowerCase();
    list=list.filter(p=>L(p.name).toLowerCase().includes(s)||p.sku.toLowerCase().includes(s));}
  return shell(role,"products",t("boProducts"),`
    <div class="card">
      <div class="chead">
        <button class="btn btn-line btn-sm" data-pcat="">${I("arrow")}${t("boCategories")}</button>
        <h3>${esc(L(c.name))} — ${list.length} ${t("boProducts")}</h3>
        <input class="sinp" id="pq" placeholder="${t("search")}" value="${esc(pf.q)}">
        <button class="btn btn-line btn-sm" data-csv="products">${I("down")}${t("export")}</button>
        <button class="btn btn-primary btn-sm" data-addpc="${esc(catId)}">${I("plus")}${t("add")}</button>
      </div>
      ${subs.length?`<div class="pcat-sub">
        <a href="javascript:void(0)" data-psub="" class="${pf.sub?"":"on"}">${t("all")}
          <span style="opacity:.6">${catProdList(catId).length}</span></a>
        ${subs.map(k=>{const n=catProdList(catId).filter(p=>p.sub===k.id).length;
          return `<a href="javascript:void(0)" data-psub="${esc(k.id)}" class="${pf.sub===k.id?"on":""}">
            ${esc(L(k.name))} <span style="opacity:.6">${n}</span></a>`;}).join("")}
      </div>`:""}
      ${boProdTable(list)}</div>`);
}
function boProdTable(list){
  const total=list.length, show=list.slice(0,100);
  if(!total) return `<div class="empty">${I("tag")}<h3>${t("noProducts")||"—"}</h3></div>`;
  return `<div class="scrollx"><table class="d"><thead><tr>
      <th>${t("boProducts")}</th><th>${t("brand")}</th><th class="n">${t("price")}</th>
      <th class="n">${t("boStock")}</th><th>${t("status")}</th><th class="n">${t("sold")}</th><th></th>
    </tr></thead><tbody>
    ${show.map(p=>{const st=stockState(p),b=brand(p.brand);
      return `<tr data-prow="${esc(p.id)}"><td><div class="rf">
        <span class="mth">${slot(p.images[0],{ratio:"",cls:"light",label:"",code:""})}</span>
        <span><b>${esc(L(p.name))}</b><br><span class="mono" style="color:var(--steel-500)">${esc(p.sku)}</span></span></div></td>
      <td>${esc(b?b.name:"—")}</td>
      <td class="n">${campaignOn(p)?`<b style="color:var(--danger)">${money(netPrice(p))}</b>`:money(p.price)}</td>
      <td class="n"><input class="stk-in" type="number" min="0" value="${p.stock}" data-setstock="${esc(p.id)}"
        title="${esc(L(L3("Ändra och lämna fältet","Change and leave the field","Değiştirip alandan çıkın")))}">
        <span class="chip ${st==="out"?"c-r":st==="low"?"c-y":"c-g"}" data-stkchip="${esc(p.id)}"
          style="margin-left:6px">${p.stock}</span></td>
      <td><button class="btn btn-line btn-xs" data-togp="${esc(p.id)}">
        ${p.hidden?`<span class="chip c-n">${esc(L(L3("Dold","Hidden","Gizli")))}</span>`
                  :`<span class="chip c-g">${esc(L(L3("Publicerad","Published","Yayında")))}</span>`}</button></td>
      <td class="n">${p.sold||0}</td>
      <td><div style="display:flex;gap:6px;justify-content:flex-end">
        <button class="btn btn-line btn-xs" data-editp="${esc(p.id)}">${I("edit")}</button>
        <button class="btn btn-line btn-xs" data-delp="${esc(p.id)}" style="color:var(--danger)">${I("trash")}</button>
      </div></td></tr>`;}).join("")}
    </tbody></table></div>
    ${total>100?`<div style="padding:14px 21px;font-size:12.6px;color:var(--steel-700)">
      ${esc(L(L3("Visar 100 av","Showing 100 of","Gösterilen: 100 /")))} ${total} —
      ${esc(L(L3("använd sökrutan","use the search box","arama kutusunu kullanın")))}</div>`:""}`;
}
/* ---------- Süper Admin paneli (#/owner) ---------- */
let owCat="", owSub="";
function owProducts(){
  const q=(owPq||"").trim();
  if(q) return owProdList(null,prods().filter(p=>L(p.name).toLowerCase().includes(q.toLowerCase())
    ||p.sku.toLowerCase().includes(q.toLowerCase())),"“"+q+"” için sonuçlar");
  if(!owCat) return owProdCats();
  const c=cat(owCat); if(!c){ owCat=""; return owProdCats(); }
  let list=catProdList(owCat);
  if(owSub) list=list.filter(p=>p.sub===owSub);
  return owProdList(c,list,L(c.name));
}
function owProdCats(){
  const mc=mainCats();
  return owShell("products","Ürünler",`
    <div class="ow-acts">
      <button class="ow-big gold" id="owaddprod">${I("plus")}Yeni ürün ekle</button>
      <button class="ow-big" id="owaddcat">${I("layers")}Yeni kategori oluştur</button>
      <button class="ow-big line" data-bulk>${I("upload")}CSV ile toplu yükle</button></div>
    <div class="ow-card"><h2>${I("layers")}${mc.length} kategori · ${prods().length} ürün
      <span class="right"><input class="ow-btn" id="owpq" placeholder="Tüm ürünlerde ara…" value="${esc(owPq)}"
        style="min-width:230px;font-weight:400"></span></h2>
      <div style="padding:0 26px 4px;font-size:14px;color:#5A6674">
        Ürünleri yönetmek istediğiniz kategoriye tıklayın.</div>
      <div class="ow-catgrid">
        ${mc.map(c=>{const n=catProdList(c.id).length,low=catLowCount(c.id);
          return `<button type="button" class="ow-catc" data-owcat="${esc(c.id)}">
            <span class="im">${slot(catCoverImg(c),{ratio:"",cls:"light",label:L(c.name),code:""})}</span>
            <span class="bd"><b>${esc(L(c.name))}</b>
              <small>${n} ürün</small>
              <span style="display:inline-block;margin-top:8px">
                ${low?owTag("y",low+" kritik stok"):owTag("g","Stok yeterli")}</span>
            </span></button>`;}).join("")}
      </div></div>`);
}
function owProdList(c,list,title){
  const subs=c?cats().filter(k=>k.parent===c.id):[];
  const total=list.length; const show=list.slice(0,200);
  return owShell("products","Ürünler",`
    <div class="ow-acts">
      <button class="ow-big line" data-owcat="">${I("arrow")}Tüm kategoriler</button>
      <button class="ow-big gold" ${c?`data-owaddin="${esc(c.id)}"`:'id="owaddprod"'}>${I("plus")}Yeni ürün ekle</button>
      <button class="ow-big line" data-bulk>${I("upload")}CSV ile toplu yükle</button></div>
    <div class="ow-card"><h2>${I("tag")}${esc(title)} — ${total} ürün
      <span class="right"><input class="ow-btn" id="owpq" placeholder="Ürün ara…" value="${esc(owPq)}"
        style="min-width:220px;font-weight:400"></span></h2>
      ${subs.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 26px 14px">
        <button class="ow-btn sm ${owSub?"":"on"}" data-owsub="">Tümü</button>
        ${subs.map(k=>`<button class="ow-btn sm ${owSub===k.id?"on":""}" data-owsub="${esc(k.id)}">
          ${esc(L(k.name))} (${catProdList(c.id).filter(p=>p.sub===k.id).length})</button>`).join("")}
      </div>`:""}
      ${total>200?`<div style="padding:0 26px 12px;font-size:14px;color:#5A6674">
        İlk 200 ürün gösteriliyor — aramayı kullanın.</div>`:""}
      ${total?`<div class="ow-scroll"><table class="ow-t"><thead><tr><th>Ürün</th><th>Kategori</th>
        <th class="num">Fiyat</th><th class="num">Stok</th><th>Durum</th><th></th></tr></thead><tbody>
        ${show.map(p=>{const cc=cat(p.cat);const np=netPrice(p);
          return `<tr><td><div class="ow-row"><span class="ow-thumb">${slot(p.images[0],{ratio:"",cls:"light",label:"",code:""})}</span>
            <span><b>${esc(L(p.name))}</b><br><span style="color:#8794A3;font-size:13px">${esc(p.sku)}</span></span></div></td>
          <td>${esc(cc?L(cc.name):"—")}</td>
          <td class="num">${np<p.price?`<b style="color:#BB3B2B">${money(np)}</b><br>
            <s style="color:#8794A3;font-weight:400">${money(p.price)}</s>`:money(p.price)}</td>
          <td class="num"><input class="stk-in" type="number" min="0" value="${p.stock}" data-setstock="${esc(p.id)}"></td>
          <td>${p.hidden?owTag("n","Gizli"):owTag("g","Yayında")} ${p.featured?owTag("y","Öne çıkan"):""}</td>
          <td><div class="ow-acts-cell">
            <button class="ow-btn sm" data-owedit="${p.id}">${I("edit")}Düzenle</button>
            <button class="ow-btn sm" data-owhide="${p.id}">${I("eye")}${p.hidden?"Göster":"Gizle"}</button>
            <button class="ow-btn sm" data-owfeat="${p.id}">${I("star")}${p.featured?"Kaldır":"Öne çıkar"}</button>
            <button class="ow-btn sm d" data-owdel="${p.id}">${I("trash")}Sil</button>
          </div></td></tr>`;}).join("")}
      </tbody></table></div>`
      :`<div style="padding:26px;color:#5A6674;font-size:15px">Bu kategoride henüz ürün yok.</div>`}
    </div>`);
}
/* ---------- olaylar ---------- */
document.addEventListener("click",e=>{
  const pc=e.target.closest("[data-pcat]");
  if(pc){ pf.cat=pc.dataset.pcat; pf.sub=""; pf.q=""; render(); return; }
  const ps=e.target.closest("[data-psub]");
  if(ps){ pf.sub=ps.dataset.psub; render(); return; }
  const ap=e.target.closest("[data-addpc]");
  if(ap){ productModal("new");
    setTimeout(()=>{const s=document.querySelector('#prodform [name="cat"]');
      if(s) s.value=ap.dataset.addpc;},30); return; }
  const tg=e.target.closest("[data-togp]");
  if(tg){ const p=prod(tg.dataset.togp);
    if(p){ p.hidden=!p.hidden;
      DB.log((S.user&&S.user.name)||"—","product.status",p.sku+(p.hidden?" → gizli":" → yayında"));
      DB.save(); toast(p.hidden?L(L3("Dold","Hidden","Ürün gizlendi")):L(L3("Publicerad","Published","Ürün yayında")));
      render(); } return; }
  const oc=e.target.closest("[data-owcat]");
  if(oc){ owCat=oc.dataset.owcat; owSub=""; owPq=""; render(); return; }
  const os=e.target.closest("[data-owsub]");
  if(os){ owSub=os.dataset.owsub; render(); return; }
  const oa=e.target.closest("[data-owaddin]");
  if(oa){ owProductForm(null);
    setTimeout(()=>{const s=document.querySelector('[name="cat"]');
      if(s) s.value=oa.dataset.owaddin;},30); return; }
});
document.addEventListener("change",e=>{
  const si=e.target.closest("[data-setstock]");
  if(!si) return;
  const p=prod(si.dataset.setstock); if(!p) return;
  const v=Math.max(0,Math.round(+si.value||0));
  if(v===p.stock) return;
  const old=p.stock; p.stock=v;
  DB.log((S.user&&S.user.name)||"—","product.stock",p.sku+": "+old+" → "+v);
  DB.save();
  const chip=document.querySelector('[data-stkchip="'+p.id+'"]');
  if(chip){ const st=stockState(p);
    chip.className="chip "+(st==="out"?"c-r":st==="low"?"c-y":"c-g"); chip.textContent=p.stock; }
  toast(L(L3("Lager uppdaterat","Stock updated","Stok güncellendi"))+" · "+p.sku+" = "+v);
});
</script>

<script>
/* ================================================================
   MUHASEBE — FATURA KAYIT DEFTERİ
   Ödeme tamamlandığı anda placeOrder faturayı zaten oluşturup
   DB.d.invoices'e yazıyor. Burada o kaydı eksiksiz gösteriyor,
   PDF indirme ve yeniden gönderme ekliyoruz.
   ================================================================ */
/* sipariş indeksi — her satırda dizi taramak yerine tek seferlik harita */
let _ordIdx=null, _ordIdxN=-1;
function ordOf(orderId){
  if(!_ordIdx||_ordIdxN!==DB.d.orders.length){
    _ordIdx=new Map(); DB.d.orders.forEach(o=>_ordIdx.set(o.id,o));
    _ordIdxN=DB.d.orders.length;
  }
  return _ordIdx.get(orderId);
}
function invPayLabel(i){
  const o=ordOf(i.orderId);
  const id=i.payment||(o&&o.payment);
  return (byId(PAYMENTS,id)||{}).label||"—";
}
function invCustomer(i){
  const o=ordOf(i.orderId);
  return (o&&o.customer)||DB.d.customers.find(x=>x.id===i.customerId)||{};
}
/* ---------- Muhasebe / Yönetici paneli (#/accounting, #/admin, #/super) ---------- */
function boInvoices(role){
  let list=DB.d.invoices.slice().sort((a,b)=>new Date(b.issued)-new Date(a.issued));
  if(if_.paid==="paid") list=list.filter(i=>i.paid);
  if(if_.paid==="unpaid") list=list.filter(i=>!i.paid);
  if(if_.q){const s=if_.q.toLowerCase();
    list=list.filter(i=>i.id.toLowerCase().includes(s)||i.orderId.toLowerCase().includes(s)
      ||(invCustomer(i).company||"").toLowerCase().includes(s)
      ||(invCustomer(i).name||"").toLowerCase().includes(s));}
  const unpaid=DB.d.invoices.filter(i=>!i.paid);
  return shell(role,"invoices",t("boInvoices"),`
    ${role==="accountant"?`<div class="note n-i">${I("lock")}<span>${t("accNotice")}</span></div>`:""}
    <div class="note n-o">${I("checkc")}<span>${esc(L(L3(
      "Varje slutförd betalning bokförs här automatiskt med fullständigt underlag.",
      "Every completed payment is posted here automatically with full details.",
      "Tamamlanan her ödeme, tüm bilgileriyle buraya otomatik işlenir.")))}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="kl">${I("doc")}${t("boInvoices")}</div><div class="kv">${DB.d.invoices.length}</div></div>
      <div class="kpi o"><div class="kl">${I("checkc")}${t("paid")}</div><div class="kv">${DB.d.invoices.length-unpaid.length}</div></div>
      <div class="kpi w"><div class="kl">${I("clock")}${t("unpaid")}</div><div class="kv">${unpaid.length}</div>
        <div class="kd">${money(sum(unpaid,i=>i.total))}</div></div>
      <div class="kpi g"><div class="kl">${I("wallet")}${t("gross")}</div><div class="kv">${money(sum(DB.d.invoices,i=>i.total))}</div></div></div>
    <div class="card"><div class="chead"><h3>${list.length} ${t("boInvoices")}</h3>
      <input class="sinp" id="iq" placeholder="${t("search")}" value="${esc(if_.q)}">
      <select class="sel" id="ipaid"><option value="">${t("all")}</option>
        <option value="paid" ${if_.paid==="paid"?"selected":""}>${t("paid")}</option>
        <option value="unpaid" ${if_.paid==="unpaid"?"selected":""}>${t("unpaid")}</option></select>
      <button class="btn btn-line btn-sm" data-csv="invoices">${I("down")}${t("export")}</button></div>
      <div class="scrollx"><table class="d"><thead><tr><th>${t("invoiceNo")}</th><th>${t("orderNo")}</th>
        <th>${t("customer")}</th><th>${t("issued")}</th><th>${t("payment")}</th>
        <th class="n">${t("net")}</th><th class="n">${t("vatAmt")}</th><th class="n">${t("gross")}</th>
        <th>${t("status")}</th><th></th></tr></thead><tbody>
        ${list.slice(0,60).map(i=>{const c=invCustomer(i);
          return `<tr><td class="mono"><b>${esc(i.id)}</b></td>
          <td class="mono" style="font-size:11.2px">${esc(i.orderId)}</td>
          <td><b>${esc(c.company||c.name||"—")}</b>${c.company&&c.name?`<br><span style="font-size:11.2px;color:var(--steel-500)">${esc(c.name)}</span>`:""}</td>
          <td>${fdate(i.issued)}<br><span style="font-size:11px;color:var(--steel-500)">${t("due")} ${fdate(i.due)}</span></td>
          <td>${esc(invPayLabel(i))}</td>
          <td class="n">${money2(i.net)}</td><td class="n">${money2(i.vat)}
            <br><span style="font-size:11px;color:var(--steel-500)">${Math.round(i.vatRate*100)}%</span></td>
          <td class="n"><b>${money2(i.total)}</b></td>
          <td><span class="chip ${i.paid?"c-g":"c-y"}">${i.paid?t("paid"):t("unpaid")}</span>
            ${i.sentCount?`<br><span style="font-size:10.6px;color:var(--steel-500)">${i.sentCount}× ${esc(L(L3("skickad","sent","gönderildi")))}</span>`:""}</td>
          <td><div style="display:flex;gap:6px;justify-content:flex-end">
            <a class="btn btn-line btn-xs" href="#/invoice/${i.id}" title="${t("view")||"Aç"}">${I("eye")}</a>
            <button class="btn btn-line btn-xs" data-invpdf="${esc(i.id)}" title="PDF">${I("down")}</button>
            <button class="btn btn-line btn-xs" data-invsend="${esc(i.id)}" title="${esc(L(L3("Skicka igen","Resend","Tekrar gönder")))}">${I("mail")}</button>
            ${!i.paid?`<button class="btn btn-line btn-xs" data-paid="${i.id}">${I("check")}</button>`:""}
          </div></td></tr>`;}).join("")}
      </tbody></table></div>
      ${DB.d.invoices.length>60?`<div style="padding:14px 21px;font-size:12.6px;color:var(--steel-700)">
        ${esc(L(L3("Visar 60 av","Showing 60 of","Gösterilen: 60 /")))} ${DB.d.invoices.length}</div>`:""}
    </div>`);
}
/* ---------- Süper Admin paneli (#/owner) ---------- */
function owInvoiceRows(list){
  return `<div class="ow-scroll"><table class="ow-t"><thead><tr><th>Fatura</th><th>Sipariş</th><th>Müşteri</th>
    <th>Tarih</th><th>Ödeme</th><th class="num">Ara toplam</th><th class="num">KDV</th>
    <th class="num">Genel toplam</th><th>Durum</th><th></th></tr></thead><tbody>
    ${list.map(i=>{const c=invCustomer(i);
      return `<tr><td><b>${esc(i.id)}</b></td><td style="font-size:13px">${esc(i.orderId)}</td>
      <td><b>${esc(c.company||c.name||"—")}</b>${c.email?`<br><span style="font-size:12.6px;color:#8794A3">${esc(c.email)}</span>`:""}</td>
      <td>${fdate(i.issued)}<br><span style="font-size:12.4px;color:#8794A3">Vade ${fdate(i.due)}</span></td>
      <td>${esc(invPayLabel(i))}</td>
      <td class="num">${money2(i.net)}</td>
      <td class="num">${money2(i.vat)}<br><span style="font-size:12.4px;color:#8794A3">%${Math.round(i.vatRate*100)}</span></td>
      <td class="num"><b>${money2(i.total)}</b></td>
      <td>${i.paid?owTag("g","Ödendi"):owTag("y","Bekliyor")}
        ${i.sentCount?`<br><span style="font-size:12px;color:#8794A3">${i.sentCount}× gönderildi</span>`:""}</td>
      <td><div class="ow-acts-cell">
        <a class="ow-btn sm" href="#/invoice/${i.id}">${I("eye")}Aç</a>
        <button class="ow-btn sm" data-invpdf="${esc(i.id)}">${I("down")}PDF indir</button>
        <button class="ow-btn sm" data-invsend="${esc(i.id)}">${I("mail")}Tekrar gönder</button>
      </div></td></tr>`;}).join("")}
  </tbody></table></div>`;
}
function owInvoices(){
  const inv=DB.d.invoices.slice().sort((a,b)=>new Date(b.issued)-new Date(a.issued));
  const unpaid=inv.filter(i=>!i.paid);
  return owShell("invoices","Faturalar",`
    <div class="ow-stats">
      <div class="ow-stat blue"><div class="l">${I("doc")}Toplam fatura</div>
        <div class="v">${inv.length}</div><div class="s">kayıtlı</div></div>
      <div class="ow-stat green"><div class="l">${I("checkc")}Ödenen</div>
        <div class="v">${inv.length-unpaid.length}</div><div class="s">tahsil edildi</div></div>
      <div class="ow-stat red"><div class="l">${I("clock")}Bekleyen</div>
        <div class="v">${unpaid.length}</div><div class="s">${money(sum(unpaid,i=>i.total))}</div></div>
      <div class="ow-stat gold"><div class="l">${I("wallet")}Brüt toplam</div>
        <div class="v">${money(sum(inv,i=>i.total))}</div><div class="s">KDV dahil</div></div>
    </div>
    <div class="ow-card"><h2>${I("doc")}${inv.length} fatura
      <span class="right"><button class="ow-btn sm" data-csv="invoices">${I("down")}CSV indir</button></span></h2>
      <div style="padding:0 26px 14px;font-size:14px;color:#5A6674">
        Müşteri ödemeyi tamamladığı anda fatura otomatik oluşur ve buraya işlenir.</div>
      ${inv.length?owInvoiceRows(inv.slice(0,80)):
        `<div style="padding:26px;color:#5A6674;font-size:15px">Henüz fatura yok.</div>`}
      ${inv.length>80?`<div style="padding:12px 26px;font-size:14px;color:#5A6674">
        Son 80 fatura gösteriliyor.</div>`:""}
    </div>`);
}
/* Muhasebe özetinin altına fatura defterini ekle */
/* DİKKAT: burada "function owAccounting(){}" kullanılamaz — bildirim hoisting
   nedeniyle orijinali değil kendini yakalar ve sonsuz özyineleme olur.
   Bu yüzden önce orijinal saklanıp sonra atama yapılıyor. */
const _owAccountingBase=owAccounting;
owAccounting=function(){
  const h=_owAccountingBase();
  const inv=DB.d.invoices.slice().sort((a,b)=>new Date(b.issued)-new Date(a.issued)).slice(0,25);
  const reg=`<div class="ow-card"><h2>${I("doc")}Fatura defteri — son ${inv.length} kayıt
      <span class="right"><a class="ow-btn sm" href="#/owner/invoices">Tümü${I("arrow")}</a></span></h2>
      <div style="padding:0 26px 14px;font-size:14px;color:#5A6674">
        Ödeme tamamlanır tamamlanmaz fatura otomatik olarak buraya işlenir.</div>
      ${inv.length?owInvoiceRows(inv):
        `<div style="padding:26px;color:#5A6674;font-size:15px">Henüz fatura yok.</div>`}</div>`;
  const i=h.lastIndexOf("</main></div>");
  if(i<0) return h;
  /* replace() yerine dilimleme — reg içindeki $ dizileri bozulmasın */
  const head=h.slice(0,i), tail=h.slice(i);
  const j=head.lastIndexOf("</div>");
  if(j<0) return h;
  return head.slice(0,j)+reg+"</div>"+head.slice(j+6)+tail;
};
</script>
